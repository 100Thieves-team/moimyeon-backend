spring.application.name: core-worker
spring.profiles.active: local

spring:
  config:
    import:
      - db-core.yml
      - monitoring.yml
      - logging.yml
      - redis-core.yml
      - email-client.yml
      - web-push-client.yml
      # db-core.yml의 환경별 기본값보다 Worker 런타임 계약이 우선해야 하므로 마지막에 둔다.
      - worker-runtime.yml

notification.worker.consumer:
  enabled: false
  fixed-delay: ${NOTIFICATION_WORKER_CONSUMER_FIXED_DELAY:1s}
  initial-delay: ${NOTIFICATION_WORKER_CONSUMER_INITIAL_DELAY:5s}

---
spring.config.activate.on-profile: local


---
spring.config.activate.on-profile: local-dev

notification.worker.consumer.enabled: true


---
spring.config.activate.on-profile: dev

notification.worker.consumer.enabled: true


---
spring.config.activate.on-profile: staging

notification.worker.consumer.enabled: true


---
spring.config.activate.on-profile: live

notification.worker.consumer.enabled: true
