spring.application.name: core-api
spring.profiles.active: local

spring:
  config:
    import:
      - monitoring.yml
      - logging.yml
      - db-core.yml
      - object-storage.yml
      - redis-core.yml
      - bedrock-client.yml
      - client-example.yml
      - security-core.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web.resources.add-mappings: false

server:
  # Behind ALB/reverse proxy: trust X-Forwarded-* so scheme/host/client-IP and
  # generated redirect URLs are correct. Harmless locally (no such headers sent).
  forward-headers-strategy: framework
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

notification.outbox.relay:
  fixed-delay: ${NOTIFICATION_OUTBOX_RELAY_FIXED_DELAY:10s}
  initial-delay: ${NOTIFICATION_OUTBOX_RELAY_INITIAL_DELAY:5s}
  stale-after: ${NOTIFICATION_OUTBOX_RELAY_STALE_AFTER:10s}
  batch-size: ${NOTIFICATION_OUTBOX_RELAY_BATCH_SIZE:100}
  lease-duration: ${NOTIFICATION_OUTBOX_RELAY_LEASE_DURATION:5m}

management.endpoint.health.group.readiness:
  include: readinessState,db

---
spring.config.activate.on-profile: local


---
spring.config.activate.on-profile: local-dev


---
spring.config.activate.on-profile: dev


---
spring.config.activate.on-profile: live
