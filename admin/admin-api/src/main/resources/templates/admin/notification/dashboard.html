<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알림 운영 현황 | 모이면 Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <p class="text-secondary mb-1">Notification Operations</p>
            <h1 class="h3 mb-0">알림 운영 현황</h1>
        </div>
        <a class="btn btn-outline-secondary" href="/admin/notifications">새로고침</a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-6">
            <section class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary mb-2">재시도 대기</p>
                    <strong class="display-6" th:text="${dashboard.pendingCount}">0</strong>
                    <span class="text-secondary ms-2">Pending</span>
                </div>
            </section>
        </div>
        <div class="col-sm-6">
            <section class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary mb-2">격리 메시지</p>
                    <strong class="display-6 text-danger" th:text="${dashboard.deadLetterCount}">0</strong>
                    <span class="text-secondary ms-2">DLQ</span>
                </div>
            </section>
        </div>
    </div>

    <section class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h2 class="h5 mb-1">최근 DLQ</h2>
            <p class="text-secondary small mb-0">최신 실패 메시지 최대 50건</p>
        </div>

        <div class="card-body text-center text-secondary py-5"
             th:if="${#lists.isEmpty(dashboard.recentDeadLetters)}">
            격리된 알림 메시지가 없습니다.
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(dashboard.recentDeadLetters)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>실패 시각</th>
                    <th>이벤트</th>
                    <th>채널</th>
                    <th>실패</th>
                    <th>시도</th>
                    <th>메시지</th>
                    <th>원본</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="deadLetter : ${dashboard.recentDeadLetters}">
                    <td class="text-nowrap" th:text="${deadLetter.failedAt}">2026-08-11T00:00:00Z</td>
                    <td>
                        <div class="fw-semibold" th:text="${deadLetter.eventType}">ROOM_APPLICATION_ACCEPTED</div>
                        <code class="small" th:text="${deadLetter.eventId}">event-id</code>
                    </td>
                    <td><span class="badge text-bg-primary" th:text="${deadLetter.channel}">EMAIL</span></td>
                    <td>
                        <div class="fw-semibold text-danger" th:text="${deadLetter.failureType}">Failure</div>
                        <small class="text-secondary" th:text="${deadLetter.originalFailureType}">OriginalFailure</small>
                    </td>
                    <td th:text="${deadLetter.attemptCount}">5</td>
                    <td class="text-break" th:text="${deadLetter.failureMessage}">실패 메시지</td>
                    <td>
                        <details>
                            <summary class="btn btn-sm btn-outline-secondary">보기</summary>
                            <div class="mt-2 text-start">
                                <div><small class="text-secondary">DLQ ID</small></div>
                                <code th:text="${deadLetter.recordId}">record-id</code>
                                <div class="mt-2"><small class="text-secondary">원본 Stream ID</small></div>
                                <code th:text="${deadLetter.sourceRecordId}">source-record-id</code>
                                <pre class="bg-dark text-light rounded p-3 mt-2 mb-0 small"
                                     th:text="${deadLetter.payload}">{}</pre>
                            </div>
                        </details>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
