spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

# 기본값 = 운영. 로컬은 아래 local 프로파일에서 설정
security:
  jwt:
    secret: ${JWT_SECRET} # 자체 세션 JWT 서명용 HMAC 키 (32바이트 이상 랜덤)
  session:
    ttl-seconds: 1209600 # 리프레시 토큰(세션) 수명
  auth:
    oauth2:
      success-redirect-uri: ${OAUTH_FRONTEND_SUCCESS_REDIRECT_URI:https://moimyeon.plady.io/auth/callback}
      failure-redirect-uri: ${OAUTH_FRONTEND_FAILURE_REDIRECT_URI:https://moimyeon.plady.io/?authError=login_failed}
    cookie:
      domain: moimyeon.plady.io # api. 와 apex 가 공유
      secure: true
      same-site: Lax
      access-max-age-seconds: 1800
      refresh-max-age-seconds: 1209600
    cors:
      allowed-origins:
        - https://moimyeon.plady.io

---
# dev: preview 프론트와 dev API 가 세션을 공유하되 운영 세션과는 쿠키 도메인을 격리한다.
# localhost -> api.dev cross-site 호출에서도 쿠키가 실리도록 SameSite=None 을 유지한다.
spring.config.activate.on-profile: dev
security:
  auth:
    oauth2:
      success-redirect-uri: ${OAUTH_FRONTEND_SUCCESS_REDIRECT_URI:https://dev.moimyeon.plady.io/auth/callback}
      failure-redirect-uri: ${OAUTH_FRONTEND_FAILURE_REDIRECT_URI:https://dev.moimyeon.plady.io/?authError=login_failed}
    cookie:
      domain: dev.moimyeon.plady.io
      same-site: None
    cors:
      allowed-origins:
        - https://dev.moimyeon.plady.io
        - http://localhost:3000

---
spring.config.activate.on-profile: local
security:
  auth:
    oauth2:
      success-redirect-uri: ${OAUTH_FRONTEND_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
      failure-redirect-uri: ${OAUTH_FRONTEND_FAILURE_REDIRECT_URI:http://localhost:3000/?authError=login_failed}
    cookie:
      domain: "" # 비워서 Domain 미지정 → localhost 에서 동작
      secure: false
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
