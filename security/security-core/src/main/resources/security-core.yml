spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

# 기본값 = 운영. 로컬은 아래 local 프로파일에서 설정
security:
  jwt:
    secret: ${JWT_SECRET} # 자체 세션 JWT 서명용 HMAC 키 (32바이트 이상 랜덤)
  session:
    ttl-seconds: 1209600 # 리프레시 토큰(세션) 수명
  auth:
    oauth2:
      success-redirect-uri: ${OAUTH_FRONTEND_SUCCESS_REDIRECT_URI:https://moimyeon.plady.io/auth/callback}
      failure-redirect-uri: ${OAUTH_FRONTEND_FAILURE_REDIRECT_URI:https://moimyeon.plady.io/?authError=login_failed}
    cookie:
      domain: moimyeon.plady.io # api. 와 apex 가 공유
      secure: true
      same-site: Lax
      access-max-age-seconds: 1800
      refresh-max-age-seconds: 1209600
    cors:
      allowed-origins:
        - https://moimyeon.plady.io

---
# dev: 로컬 프론트(localhost:3000) 개발이 dev API 를 직접 호출할 수 있도록 오리진을 추가한다.
# 자격증명(쿠키) 허용은 CorsConfig 에서 전 환경 공통. cross-site(localhost -> api.dev)에서도
# 쿠키가 실리도록 SameSite 만 None 으로 완화한다(Secure=true 는 기본값 유지).
spring.config.activate.on-profile: dev
security:
  auth:
    cookie:
      same-site: None
    cors:
      allowed-origins:
        - https://moimyeon.plady.io
        - http://localhost:3000

---
spring.config.activate.on-profile: local
security:
  auth:
    oauth2:
      success-redirect-uri: ${OAUTH_FRONTEND_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
      failure-redirect-uri: ${OAUTH_FRONTEND_FAILURE_REDIRECT_URI:http://localhost:3000/?authError=login_failed}
    cookie:
      domain: "" # 비워서 Domain 미지정 → localhost 에서 동작
      secure: false
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
