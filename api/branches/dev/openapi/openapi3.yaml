    get:
      tags:
      - v1
      summary: 참가 신청 목록 조회 (방장)
      description: "방장이 룸 관리 화면에서 참가 신청 목록을 확인한다(「룸 참여」 §4.3). 신청자의 공개 정보·전달 사항·처리\
        \ 상태를 신청 시각 오름차순으로 내려준다. 철회된 신청은 제외된다. 전달 사항은 방장 외 비공개이며, 이력서 원본으로 가는 경로는\
        \ 없다(§6). 방장만 조회할 수 있다(E1406). 이력서 AI 요약(J5)·신청자 직무·활동 정보는 연동 전까지 null 로 내\
        려간다."
