  /v1/rooms/{roomId}/applications:
    get:
      tags:
      - v1
      summary: 참가 신청 목록 조회 (방장)
      description: "방장이 룸 관리 화면에서 참가 신청 목록을 확인한다(「룸 참여」 §4.3). 신청자의 공개 정보·전달 사항·이력\
        서 AI 요약·처리 상태를 함께 내려준다. AI 요약이 아직 없으면 status=PROCESSING('요약 준비 중')으로 표시된다\
        . 전달 사항·요약은 방장 외 비공개이며, 이력서 원본으로 가는 경로는 없다(§6). (모킹: 고정 신청 2건(대기)을 반환한다)"
      operationId: roomApplications
      parameters:
      - name: roomId
        in: path
        description: 신청 목록을 조회할 룸 id (UUID)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms-roomId-applications-1743114874"
              examples:
                roomApplications:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "applications" : [ {
                          "applicationId" : 3001,
                          "applicant" : {
                            "memberId" : "00000000-0000-0000-0000-000000000002",
