    post:
      tags:
      - v1
      summary: 참가 신청 수락
      description: "방장이 대기 중인 신청을 수락한다(「룸 참여」 §4.4). 서버가 정원을 최종 확인한 뒤 신청자를 참여자로 등록\
        하고 현재 인원을 증가시킨다. 정원에 도달하면 모집 상태가 마감(CLOSED)으로 계산된다. 마지막 자리를 두고 동시 수락이 몰려도\
        \ 1건만 성공한다(룸 행 잠금). 방장만 처리할 수 있고(E1406), 이미 처리된 신청(E1409)·모집 중이 아닌 방(E1410)·\
        정원 초과(E1411)는 거부된다."
      operationId: acceptApplication
      parameters:
      - name: roomId
        in: path
        description: 룸 id (UUID)
        required: true
        schema:
          type: string
      - name: applicationId
        in: path
        description: 수락할 신청 id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
