openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api.dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-07-31",
                        "datetime" : "2026-07-31T09:30:27.388488919",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-07-31",
                        "datetime" : "2026-07-31T09:30:27.566684641",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: 관심 회사 태그 입력의 검색 소스. 회사명 부분 일치로 유효(미폐기) 회사를 최대 20건 반환한다. 크롤러가 관리하는
        참조 데이터다. 검색어가 없거나 1~50자를 벗어나면 400(E400)으로 응답한다.
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (회사명 부분 일치, 1~50자)"
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                searchCompanies-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : {
                          "query" : "size must be between 1 and 50"
                        }
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
  /v1/job-postings:
    post:
      tags:
      - v1
      summary: 채용 공고 즉시 생성
      description: "링크로 공고를 즉시 생성한다(§4.1). 승인 대기 없이 verified=false 로 만들어져 바로 룸 생성에\
        \ 사용할 수 있다. 회사는 기존 카탈로그 회사 id 로 받고, 공고명은 사용자가 확정한 값을 사용한다. companyId·url·\
        postingName 누락·형식 오류는 400(E400)으로 응답한다. (모킹: 고정 jobPostingId(90101)를 반환한다)"
      operationId: createJobPosting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-job-postings1900667415"
            examples:
              createJobPosting:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-postings1515935278"
              examples:
                createJobPosting:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "jobPostingId" : 90101,
                        "companyId" : 43429,
                        "postingName" : "프론트엔드 개발자 (결제플랫폼)",
                        "sourceUrl" : "https://company.example.com/careers/12345",
                        "verified" : false
                      },
                      "error" : null
                    }
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-roles-1436485238"
              examples:
                jobRoles:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "groups" : [ {
                          "code" : "IT_개발",
                          "displayName" : "IT·개발",
                          "roles" : [ {
                            "jobRoleId" : 1,
                            "code" : "서버_백엔드",
                            "displayName" : "서버·백엔드"
                          }, {
                            "jobRoleId" : 2,
                            "code" : "프론트엔드",
                            "displayName" : "프론트엔드"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 프로필 선호 지역 드롭다운 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가
        관리하는 참조 데이터다.
      operationId: regions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-regions1871099627"
              examples:
                regions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "sidos" : [ {
                          "name" : "서울특별시",
                          "shortName" : "서울",
                          "sigungus" : [ {
                            "sigunguId" : 1,
                            "name" : "강남구"
                          }, {
                            "sigunguId" : 2,
                            "name" : "마포구"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/rooms:
    get:
      tags:
      - v1
      summary: 룸 탐색 목록 조회
      description: "조건에 맞는 모집 중인 룸 목록을 조회한다(「룸 탐색」 §4.1~§4.3). 비로그인도 조회할 수 있다. 필터는\
        \ AND 로 결합하고, 완료·취소·일정 경과 룸은 제외된다. (모킹: 필터·정렬을 실제 적용하지 않고 고정 목록을 반환하되 요청 sort\
        \ 는 그대로 되돌려준다)"
      operationId: rooms
      parameters:
      - name: companyId
        in: query
        description: 회사 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: jobRoleId
        in: query
        description: 직무 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: round
        in: query
        description: 면접 차수 필터 (선택)
        required: false
        schema:
          type: string
      - name: method
        in: query
        description: "진행 방식 필터 (ONLINE | OFFLINE, 선택)"
        required: false
        schema:
          type: string
      - name: sigunguId
        in: query
        description: 오프라인 지역 시군구 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: availableOnly
        in: query
        description: 참여 가능한 룸만 보기 토글 (기본 false)
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 (SCHEDULE 일정 빠른 순 | RECENT 최근 생성순 | CLOSING 마감 임박순, 기본 SCHEDULE)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms-126398339"
              examples:
                rooms:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "rooms" : [ {
                          "roomId" : "01920000-0000-7000-8000-000000000001",
                          "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                          "company" : {
                            "companyId" : 1,
                            "name" : "달빛페이"
                          },
                          "jobPosting" : {
                            "jobPostingId" : 1,
                            "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                          },
                          "jobRole" : {
                            "jobRoleId" : 1,
                            "code" : "FRONTEND_DEVELOPER",
                            "displayName" : "프론트엔드 개발"
                          },
                          "round" : "FIRST",
                          "roundLabel" : "1차 면접",
                          "type" : "JOB",
                          "typeLabel" : "직무 면접",
                          "method" : "OFFLINE",
                          "methodLabel" : "오프라인",
                          "region" : {
                            "sigunguId" : 1,
                            "label" : "서울 강남구"
                          },
                          "schedule" : {
                            "date" : "2026-08-01",
                            "dayOfWeekLabel" : "토",
                            "startTime" : "14:00",
                            "startTimeLabel" : "오후 2:00",
                            "durationMinutes" : 90,
                            "durationLabel" : "90분",
                            "displayLabel" : "8월 1일 (토) 오후 2:00 · 90분"
                          },
                          "recruit" : {
                            "current" : 1,
                            "max" : 6,
                            "recruitStatus" : "RECRUITING",
                            "recruitStatusLabel" : "모집 중"
                          }
                        }, {
                          "roomId" : "01920000-0000-7000-8000-000000000002",
                          "title" : "정산 백엔드 최종 면접 같이 대비해요",
                          "company" : {
                            "companyId" : 1,
                            "name" : "달빛페이"
                          },
                          "jobPosting" : {
                            "jobPostingId" : 2,
                            "postingName" : "백엔드 개발자 (정산)"
                          },
                          "jobRole" : {
                            "jobRoleId" : 2,
                            "code" : "BACKEND_DEVELOPER",
                            "displayName" : "백엔드 개발"
                          },
                          "round" : "FINAL",
                          "roundLabel" : "최종 면접",
                          "type" : null,
                          "typeLabel" : null,
                          "method" : "ONLINE",
                          "methodLabel" : "온라인",
                          "region" : null,
                          "schedule" : {
                            "date" : "2026-08-03",
                            "dayOfWeekLabel" : "월",
                            "startTime" : "20:00",
                            "startTimeLabel" : "오후 8:00",
                            "durationMinutes" : 60,
                            "durationLabel" : "60분",
                            "displayLabel" : "8월 3일 (월) 오후 8:00 · 60분"
                          },
                          "recruit" : {
                            "current" : 4,
                            "max" : 4,
                            "recruitStatus" : "CLOSED",
                            "recruitStatusLabel" : "모집 마감"
                          }
                        } ],
                        "sort" : "SCHEDULE",
                        "totalCount" : 2
                      },
                      "error" : null
                    }
    post:
      tags:
      - v1
      summary: 룸 생성
      description: "생성 위저드(「룸 생성」 §4.1~§4.8)의 입력을 한 번에 받아 룸을 만들고 즉시 모집(RECRUITING)\
        \ 상태로 등록한다(§4.8). 공고를 고르면 회사가 함께 확정되므로 룸에는 회사를 따로 저장하지 않는다(공고 → 회사 파생). 직무\
        ·지역·이력서는 카탈로그/보관함 참조 id 를 받는다. (모킹: 도메인 구현 전까지 고정 roomId(UUID)를 반환한다)"
      operationId: createRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-rooms-1620848945"
            examples:
              createRoom:
                value: |-
                  {
                    "postingId" : 1,
                    "jobRoleId" : 1,
                    "round" : "FIRST",
                    "type" : "JOB",
                    "method" : "OFFLINE",
                    "sigunguId" : 1,
                    "minParticipants" : 3,
                    "maxParticipants" : 6,
                    "schedule" : {
                      "date" : "2026-08-01",
                      "startTime" : "14:00",
                      "durationMinutes" : 90
                    },
                    "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                    "description" : "실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.",
                    "resumeId" : 90001,
                    "resumePublic" : true
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms-583341076"
              examples:
                createRoom:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "roomId" : "01920000-0000-7000-8000-000000000001",
                        "status" : "RECRUITING"
                      },
                      "error" : null
                    }
  /v1/terms:
    get:
      tags:
      - v1
      summary: 현재 유효 약관 목록 조회
      description: 현재 유효한(ACTIVE) 약관 전체를 본문 포함으로 반환한다. 로그인 모달의 약관 링크에서 사용하므로 비로그인
        접근을 허용한다.
      operationId: termsList
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-terms1673199050"
              examples:
                termsList:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "terms" : [ {
                          "termsId" : "47391e71-c694-4f3b-8bf6-6595e3286993",
                          "type" : "SERVICE",
                          "version" : "v1.0",
                          "title" : "모이면 이용약관",
                          "content" : "제1조(목적) 이 약관은 모이면 서비스의 이용 조건과 절차를 규정합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        }, {
                          "termsId" : "918ddef2-cb85-4a71-850c-130413288ccc",
                          "type" : "PRIVACY",
                          "version" : "v1.0",
                          "title" : "개인정보 처리방침",
                          "content" : "모이면은 회원 가입과 서비스 제공을 위해 최소한의 개인정보를 수집·이용합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        } ]
                      },
                      "error" : null
                    }
  /v1/auth/logout:
    post:
      tags:
      - v1
      summary: 로그아웃
      description: REFRESH_TOKEN 쿠키의 세션을 폐기하고 ACCESS_TOKEN·REFRESH_TOKEN 쿠키를 만료(Set-Cookie)시킨다.
        쿠키가 없어도 성공으로 응답한다.
      operationId: authLogout
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 만료 처리된 ACCESS_TOKEN·REFRESH_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                authLogout:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/auth/refresh:
    post:
      tags:
      - v1
      summary: 액세스 토큰 재발급
      description: "REFRESH_TOKEN 쿠키의 세션 크리덴셜을 검증해 새 액세스 토큰을 ACCESS_TOKEN 쿠키(Set-Cookie)로\
        \ 재발급한다. 쿠키가 없거나 세션이 만료·폐기됐으면 401(E1104)로 응답하며, FE 는 재로그인으로 보낸다."
      operationId: authRefresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 재발급된 ACCESS_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                authRefresh:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                authRefresh-e1104:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1104",
                        "message" : "세션이 유효하지 않습니다. 다시 로그인해주세요.",
                        "data" : null
                      }
                    }
  /v1/job-postings/link-metadata:
    post:
      tags:
      - v1
      summary: 채용 공고 링크 메타데이터 조회
      description: "목록에 없는 공고를 만들기 전, 링크의 OG 태그를 읽어 공고명 후보와 미리보기(이미지·설명·출처)를 돌려준다\
        (§4.1). 회사는 OG 에서 추출하지 않으며, 생성 요청에서 목록으로 지정한다. url 누락·형식 오류는 400(E400)으로 응\
        답한다. (모킹: 링크와 무관하게 고정 메타를 반환하되 요청 url 을 출처로 반영한다)"
      operationId: jobPostingLinkMetadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-job-postings-link-metadata-637272183"
            examples:
              jobPostingLinkMetadata:
