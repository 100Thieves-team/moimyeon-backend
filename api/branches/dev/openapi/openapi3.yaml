        FAILED 상태를 가지며 준비 중이면 text가 null이다. PROCESSING은 시작 후 최대 1분이며, 시간이 지나면 AI를\
        \ 자동 재호출하지 않고 FAILED로 확정한다. 인증 정보가 없으면 401(E1102)로 응답한다. 목 API는 고정 이력서 4건\
