              examples:
                acceptApplication:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "applicationId" : 3001,
                        "status" : "ACCEPTED",
                        "statusLabel" : "수락",
                        "recruit" : {
