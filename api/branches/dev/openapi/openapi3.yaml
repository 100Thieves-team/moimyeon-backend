      - v1
      summary: 회사별 채용 공고 목록 조회
      description: "기본 정보(「룸 생성」 §4.1)에서 회사를 고르면 그 회사에 속한 활성 공고 목록이 최신순 최대 20건 채워진\
        다. 공고명(query)으로 부분 검색할 수 있고, 공고를 고르면 회사가 확정되며 대표 직무로 직무 셀렉트가 자동 채워질 수 있다.\
        \ 미검증 공고(verified=false)도 목록에는 포함된다(탐색 필터에서만 숨김, BE-03). query 가 50자를 초과하면\
        \ 400(E400)."
      operationId: jobPostings
      parameters:
      - name: companyId
        in: path
        description: 공고를 조회할 회사 id (/v1/companies 검색 결과)
        required: true
        schema:
          type: string
      - name: query
        in: query
        description: "공고명 부분 일치 검색어 (선택, 최대 50자, 없으면 회사 전체 공고)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
