    post:
      tags:
      - v1
      summary: 룸 생성
      description: "생성 위저드(「룸 생성」 §4.1~§4.8)의 입력을 한 번에 받아 룸을 만들고 즉시 모집(RECRUITING)\
        \ 상태로 등록한다(§4.8). 공고를 고르면 회사가 함께 확정되므로 룸에는 회사를 따로 저장하지 않는다(공고 → 회사 파생). 직무\
        ·지역·이력서는 카탈로그/보관함 참조 id 를 받는다. (모킹: 도메인 구현 전까지 고정 roomId(UUID)를 반환한다)"
