      description: "인증 회원이 소유한 이력서 한 건을 조회한다. AI 요약이 PROCESSING이면 클라이언트는 이 API를 일정\
        \ 간격으로 폴링하고 DONE 또는 FAILED가 되면 중단한다. PROCESSING은 시작 후 최대 1분이며 시간 초과 시 자동 재\
        처리 없이 FAILED가 된다. SSE는 제공하지 않는다. 식별자 형식 오류는 400(E400), 존재하지 않거나 본인 소유가 아닌\
        \ 이력서는 404(E1010), 인증 정보 없음은 401(E1102)로 응답한다."
      operationId: resume
      parameters:
