openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api.dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-07-30",
                        "datetime" : "2026-07-30T14:59:26.867848896",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-07-30",
                        "datetime" : "2026-07-30T14:59:27.0260291",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: 관심 회사 태그 입력의 검색 소스. 회사명 부분 일치로 유효(미폐기) 회사를 최대 20건 반환한다. 크롤러가 관리하는
        참조 데이터다. 검색어가 없거나 1~50자를 벗어나면 400(E400)으로 응답한다.
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (회사명 부분 일치, 1~50자)"
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me910352763"
              examples:
                searchCompanies-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : {
                          "query" : "size must be between 1 and 50"
                        }
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
  /v1/interviews:
    post:
      tags:
      - v1
      summary: 면접 생성
      description: "생성 위저드(B·06~B·09)의 입력을 한 번에 받아 면접을 만들고 즉시 모집(RECRUITING) 상태로 등\
        록한다(§4.8). 회사·직무·지역·이력서는 카탈로그/업로드 참조 id 를 받는다. (모킹: 도메인 구현 전까지 고정 식별자(interviewId=1024)를\
        \ 반환한다)"
      operationId: createInterview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-interviews516247986"
            examples:
              createInterview:
                value: |-
                  {
                    "companyId" : 1,
                    "jobPostingId" : 1,
                    "jobRoleId" : 1,
                    "round" : "FIRST",
                    "type" : "JOB",
                    "method" : "OFFLINE",
                    "sigunguId" : 1,
                    "minParticipants" : 3,
                    "maxParticipants" : 6,
                    "schedule" : {
                      "date" : "2026-08-01",
                      "startTime" : "14:00",
                      "durationMinutes" : 90
                    },
                    "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                    "description" : "실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.",
                    "resumeId" : 90001,
                    "discloseResumeOriginal" : true
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-interviews2000552289"
              examples:
                createInterview:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "interviewId" : 1024,
                        "status" : "RECRUITING"
                      },
                      "error" : null
                    }
  /v1/job-posting-requests:
    post:
      tags:
      - v1
      summary: 채용 공고 링크 추가 요청
      description: "'찾는 공고가 없나요? 공고 링크를 남기면 추가해 드려요'(B·06, §4.1) — 목록에 없는 공고를 링크로\
        \ 접수한다. 회사 미선택 상태에서도 요청할 수 있다. url 누락·형식 오류는 400(E400)으로 응답한다. (모킹: 접수(RECEIVED)만\
        \ 반환하고 고정 requestId(5001)를 돌려준다)"
      operationId: requestJobPosting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-job-posting-requests-1605368061"
            examples:
              requestJobPosting:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "memo" : "결제플랫폼 프론트엔드 공고예요."
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-posting-requests2037882423"
              examples:
                requestJobPosting:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "requestId" : 5001,
                        "status" : "RECEIVED"
                      },
                      "error" : null
                    }
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-roles-1436485238"
              examples:
                jobRoles:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "groups" : [ {
                          "code" : "IT_개발",
                          "displayName" : "IT·개발",
                          "roles" : [ {
                            "jobRoleId" : 1,
                            "code" : "서버_백엔드",
                            "displayName" : "서버·백엔드"
                          }, {
                            "jobRoleId" : 2,
                            "code" : "프론트엔드",
                            "displayName" : "프론트엔드"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 프로필 선호 지역 드롭다운 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가
        관리하는 참조 데이터다.
      operationId: regions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-regions1871099627"
              examples:
                regions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "sidos" : [ {
                          "name" : "서울특별시",
                          "shortName" : "서울",
                          "sigungus" : [ {
                            "sigunguId" : 1,
                            "name" : "강남구"
                          }, {
                            "sigunguId" : 2,
                            "name" : "마포구"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/resumes:
    post:
      tags:
      - v1
      summary: 이력서 업로드
      description: "소개와 이력서(B·08) 단계의 이력서 PDF 업로드. multipart/form-data 로 파일 파트(file)를\
        \ 받는다. 업로드 직후 AI 요약은 PROCESSING 이며, 이후 이력서 조회로 폴링해 DONE 을 확인한다(§4.5). (모킹\
        : 파일을 저장하지 않고 메타데이터만 에코하며 고정 resumeId(90001)를 반환한다)"
      operationId: uploadResume
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-resumes-1674245103"
              examples:
                uploadResume:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "resumeId" : 90001,
                        "fileName" : "김민수_이력서.pdf",
                        "fileSize" : 26,
                        "fileSizeLabel" : "26B",
                        "status" : "UPLOADED",
                        "aiSummary" : {
                          "status" : "PROCESSING",
                          "text" : null
                        }
                      },
                      "error" : null
                    }
  /v1/terms:
    get:
      tags:
      - v1
      summary: 현재 유효 약관 목록 조회
      description: 현재 유효한(ACTIVE) 약관 전체를 본문 포함으로 반환한다. 로그인 모달의 약관 링크에서 사용하므로 비로그인
        접근을 허용한다.
      operationId: termsList
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-terms1673199050"
              examples:
                termsList:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "terms" : [ {
                          "termsId" : "b480f429-dcf7-45b2-9161-5d29ddefac0c",
                          "type" : "SERVICE",
                          "version" : "v1.0",
                          "title" : "모이면 이용약관",
                          "content" : "제1조(목적) 이 약관은 모이면 서비스의 이용 조건과 절차를 규정합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        }, {
                          "termsId" : "0d1cb8cc-9a25-4f11-a607-1f13d1da5f38",
                          "type" : "PRIVACY",
                          "version" : "v1.0",
                          "title" : "개인정보 처리방침",
                          "content" : "모이면은 회원 가입과 서비스 제공을 위해 최소한의 개인정보를 수집·이용합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        } ]
                      },
                      "error" : null
                    }
  /v1/auth/logout:
    post:
      tags:
      - v1
      summary: 로그아웃
      description: REFRESH_TOKEN 쿠키의 세션을 폐기하고 ACCESS_TOKEN·REFRESH_TOKEN 쿠키를 만료(Set-Cookie)시킨다.
        쿠키가 없어도 성공으로 응답한다.
      operationId: authLogout
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 만료 처리된 ACCESS_TOKEN·REFRESH_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                authLogout:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/auth/refresh:
    post:
      tags:
      - v1
      summary: 액세스 토큰 재발급
      description: "REFRESH_TOKEN 쿠키의 세션 크리덴셜을 검증해 새 액세스 토큰을 ACCESS_TOKEN 쿠키(Set-Cookie)로\
        \ 재발급한다. 쿠키가 없거나 세션이 만료·폐기됐으면 401(E1104)로 응답하며, FE 는 재로그인으로 보낸다."
      operationId: authRefresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 재발급된 ACCESS_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                authRefresh:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me910352763"
              examples:
                authRefresh-e1104:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1104",
                        "message" : "세션이 유효하지 않습니다. 다시 로그인해주세요.",
                        "data" : null
                      }
                    }
  /v1/interviews/form-options:
    get:
      tags:
      - v1
      summary: 면접 생성 폼 선택지 조회
      description: 면접 정보·진행 방식(B·06·B·07) 폼의 회차·유형·진행 방식·예상 시간·인원 제약 선택지를 한 번에 내려준다.
        라벨을 서버가 소유하도록 목으로 제공한다.
      operationId: interviewFormOptions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-interviews-form-options-38619118"
              examples:
                interviewFormOptions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "rounds" : [ {
                          "code" : "FIRST",
                          "label" : "1차"
                        }, {
                          "code" : "SECOND",
                          "label" : "2차"
                        }, {
                          "code" : "THIRD",
                          "label" : "3차"
                        }, {
                          "code" : "FINAL",
                          "label" : "최종"
                        } ],
                        "types" : [ {
                          "code" : "JOB",
                          "label" : "직무 면접"
                        }, {
                          "code" : "CULTURE_FIT",
                          "label" : "컬처핏"
                        }, {
                          "code" : "EXECUTIVE",
                          "label" : "임원 면접"
                        }, {
                          "code" : "TECH_ASSIGNMENT",
                          "label" : "기술 과제"
                        } ],
                        "methods" : [ {
                          "code" : "ONLINE",
                          "label" : "온라인",
                          "hint" : "화상 링크는 진행이 확정되면 만들어져요."
                        }, {
                          "code" : "OFFLINE",
                          "label" : "오프라인",
                          "hint" : "지역만 정하면 돼요."
                        } ],
                        "durations" : [ {
                          "minutes" : 30,
                          "label" : "30분"
                        }, {
                          "minutes" : 60,
                          "label" : "60분"
                        }, {
                          "minutes" : 90,
                          "label" : "90분"
                        }, {
                          "minutes" : 120,
                          "label" : "120분"
                        } ],
                        "participantConstraints" : {
                          "min" : 2,
                          "max" : 8
                        }
                      },
                      "error" : null
                    }
  /v1/interviews/{interviewId}:
    get:
      tags:
      - v1
      summary: 면접 상세 조회
      description: "생성 완료(B·10) 및 상세 화면. 공개 데이터만 노출한다(§6). 방장 블록의 신뢰 지표는 공개 프로필 API\
        \ 와 같은 값을 미러링한다. (모킹: 도메인 구현 전까지 figma 목업 값 고정 반환)"
      operationId: interviewDetail
      parameters:
      - name: interviewId
        in: path
        description: 조회할 면접 id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-interviews-interviewId-580137958"
              examples:
                interviewDetail:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "interviewId" : 1024,
                        "status" : "RECRUITING",
                        "statusLabel" : "모집 중",
                        "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                        "company" : {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        },
                        "jobPosting" : {
                          "jobPostingId" : 1,
                          "title" : "프론트엔드 개발자 (결제플랫폼)"
                        },
                        "jobRole" : {
                          "jobRoleId" : 1,
                          "code" : "FRONTEND_DEVELOPER",
                          "displayName" : "프론트엔드 개발"
                        },
                        "round" : "FIRST",
                        "roundLabel" : "1차 면접",
                        "type" : "JOB",
                        "typeLabel" : "직무 면접",
                        "method" : "OFFLINE",
                        "methodLabel" : "오프라인",
                        "region" : {
                          "sigunguId" : 1,
                          "label" : "서울 강남구"
                        },
                        "schedule" : {
                          "date" : "2026-08-01",
                          "dayOfWeekLabel" : "토",
                          "startTime" : "14:00",
                          "startTimeLabel" : "오후 2:00",
                          "durationMinutes" : 90,
                          "durationLabel" : "90분",
                          "displayLabel" : "8월 1일 (토) 오후 2:00 · 90분"
                        },
                        "description" : "실제 1차 면접 형식 그대로 진행해요. 한 사람씩 30분 모의면접을 보고, 끝나면 다 같이 피드백을 나눠요. 결제·정산 도메인 질문 위주로 준비할게요.",
                        "notice" : "신청할 땐 이력서를 올려요. 확정 후 취소·노쇼는 활동 이력에 남아요.",
                        "recruit" : {
                          "current" : 1,
                          "min" : 3,
                          "max" : 6,
                          "confirmable" : false,
