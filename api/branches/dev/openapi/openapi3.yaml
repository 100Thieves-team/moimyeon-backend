openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api.dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-08-05",
                        "datetime" : "2026-08-05T05:39:19.306491293",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-08-05",
                        "datetime" : "2026-08-05T05:39:19.534944886",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: 관심 회사 태그 입력의 검색 소스. 회사명 부분 일치로 검증 완료된 유효(미폐기) 회사를 최대 20건 반환한다.
        검색어가 없거나 공백이거나 1~50자를 벗어나면 400(E400)으로 응답한다.
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (회사명 부분 일치, 공백 불가, 1~50자)"
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                searchCompanies-e400-length:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
                searchCompanies-e400-blank:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
  /v1/job-postings:
    post:
      tags:
      - v1
      summary: 채용 공고 즉시 생성
      description: "링크로 공고를 즉시 생성한다(§4.1). 승인 대기 없이 verified=false 로 만들어져 바로 룸 생성에\
        \ 사용할 수 있다. 회사는 기존 카탈로그 회사 id 로 받고, 공고명은 사용자가 확정한 값을 쓰며, 생성자는 인증 회원으로 기록된다\
        . 같은 URL 재요청은 새로 만들지 않고 기존 공고를 돌려준다(멱등). companyId·url·postingName 누락·형식 오\
        류는 400(E400), 존재하지 않는 회사는 400(E1303), 미인증은 401(E1102)."
      operationId: createJobPosting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-job-postings-1848070641"
            examples:
              createJobPosting-e400:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "   "
                  }
              createJobPosting-e1102:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                  }
              createJobPosting:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                createJobPosting-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                createJobPosting-e1102:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1102",
                        "message" : "인증이 필요합니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-postings1538643122"
              examples:
                createJobPosting:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "jobPostingId" : 90101,
                        "companyId" : 43429,
                        "postingName" : "프론트엔드 개발자 (결제플랫폼)",
                        "sourceUrl" : "https://company.example.com/careers/12345",
                        "verified" : false
                      },
                      "error" : null
                    }
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-roles-1436485238"
              examples:
                jobRoles:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "groups" : [ {
                          "code" : "IT_개발",
                          "displayName" : "IT·개발",
                          "roles" : [ {
                            "jobRoleId" : 1,
                            "code" : "서버_백엔드",
                            "displayName" : "서버·백엔드"
                          }, {
                            "jobRoleId" : 2,
                            "code" : "프론트엔드",
                            "displayName" : "프론트엔드"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 프로필 선호 지역 드롭다운 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가
        관리하는 참조 데이터다.
      operationId: regions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-regions1871099627"
              examples:
                regions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "sidos" : [ {
                          "name" : "서울특별시",
                          "shortName" : "서울",
                          "sigungus" : [ {
                            "sigunguId" : 1,
                            "name" : "강남구"
                          }, {
                            "sigunguId" : 2,
                            "name" : "마포구"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/rooms:
    get:
      tags:
      - v1
      summary: 룸 탐색 목록 조회
      description: "조건에 맞는 모집 중인 룸 목록을 조회한다(「룸 탐색」 §4.1~§4.3). 비로그인도 조회할 수 있다. 필터는\
        \ AND 로 결합하고, 완료·취소·일정 경과 룸은 제외된다. (모킹: 필터·정렬을 실제 적용하지 않고 고정 목록을 반환하되 요청 sort\
        \ 는 그대로 되돌려준다)"
      operationId: rooms
      parameters:
      - name: companyId
        in: query
        description: 회사 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: jobRoleId
        in: query
        description: 직무 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: round
        in: query
        description: 면접 차수 필터 (선택)
        required: false
        schema:
          type: string
      - name: method
        in: query
        description: "진행 방식 필터 (ONLINE | OFFLINE, 선택)"
        required: false
        schema:
          type: string
      - name: sigunguId
        in: query
        description: 오프라인 지역 시군구 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: availableOnly
        in: query
        description: 참여 가능한 룸만 보기 토글 (기본 false)
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 (SCHEDULE 일정 빠른 순 | RECENT 최근 생성순 | CLOSING 마감 임박순, 기본 SCHEDULE)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms-126398339"
              examples:
                rooms:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "rooms" : [ {
                          "roomId" : "01920000-0000-7000-8000-000000000001",
                          "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                          "company" : {
                            "companyId" : 1,
                            "name" : "달빛페이"
                          },
                          "jobPosting" : {
                            "jobPostingId" : 1,
                            "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                          },
                          "jobRole" : {
                            "jobRoleId" : 1,
                            "code" : "FRONTEND_DEVELOPER",
                            "displayName" : "프론트엔드 개발"
                          },
                          "round" : "FIRST",
                          "roundLabel" : "1차 면접",
                          "type" : "JOB",
                          "typeLabel" : "직무 면접",
                          "method" : "OFFLINE",
                          "methodLabel" : "오프라인",
                          "region" : {
                            "sigunguId" : 1,
                            "label" : "서울 강남구"
                          },
                          "schedule" : {
                            "date" : "2026-08-01",
                            "dayOfWeekLabel" : "토",
                            "startTime" : "14:00",
                            "startTimeLabel" : "오후 2:00",
                            "durationMinutes" : 90,
                            "durationLabel" : "90분",
                            "displayLabel" : "8월 1일 (토) 오후 2:00 · 90분"
                          },
                          "recruit" : {
                            "current" : 1,
                            "max" : 6,
                            "recruitStatus" : "RECRUITING",
                            "recruitStatusLabel" : "모집 중"
                          }
                        }, {
                          "roomId" : "01920000-0000-7000-8000-000000000002",
                          "title" : "정산 백엔드 최종 면접 같이 대비해요",
