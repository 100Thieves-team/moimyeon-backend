openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api-dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-07-24",
                        "datetime" : "2026-07-24T10:22:46.695661135",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-07-24",
                        "datetime" : "2026-07-24T10:22:46.883150754",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: 관심 회사 태그 입력의 검색 소스. 회사명 부분 일치로 유효(미폐기) 회사를 최대 20건 반환한다. 크롤러가 관리하는
        참조 데이터다.
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (회사명 부분 일치, 1~50자)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-roles-1436485238"
              examples:
                jobRoles:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "groups" : [ {
                          "code" : "IT_개발",
                          "displayName" : "IT·개발",
                          "roles" : [ {
                            "jobRoleId" : 1,
                            "code" : "서버_백엔드",
                            "displayName" : "서버·백엔드"
                          }, {
                            "jobRoleId" : 2,
                            "code" : "프론트엔드",
                            "displayName" : "프론트엔드"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 프로필 선호 지역 드롭다운 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가
        관리하는 참조 데이터다.
      operationId: regions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-regions1871099627"
              examples:
                regions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "sidos" : [ {
                          "name" : "서울특별시",
                          "shortName" : "서울",
                          "sigungus" : [ {
                            "sigunguId" : 1,
                            "name" : "강남구"
                          }, {
                            "sigunguId" : 2,
                            "name" : "마포구"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/terms:
    get:
      tags:
      - v1
      summary: 현재 유효 약관 목록 조회
      description: 현재 유효한(ACTIVE) 약관 전체를 본문 포함으로 반환한다. 로그인 모달의 약관 링크에서 사용하므로 비로그인
        접근을 허용한다.
      operationId: termsList
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-terms1673199050"
              examples:
                termsList:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "terms" : [ {
                          "termsId" : "22d19c0a-ffcb-4946-9e35-dedaef0b1600",
                          "type" : "SERVICE",
                          "version" : "v1.0",
                          "title" : "모이면 이용약관",
                          "content" : "제1조(목적) 이 약관은 모이면 서비스의 이용 조건과 절차를 규정합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        }, {
                          "termsId" : "de8ac391-0785-42a7-b7d3-79be3e1f94d5",
                          "type" : "PRIVACY",
                          "version" : "v1.0",
                          "title" : "개인정보 처리방침",
                          "content" : "모이면은 회원 가입과 서비스 제공을 위해 최소한의 개인정보를 수집·이용합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        } ]
                      },
                      "error" : null
                    }
  /v1/auth/logout:
    post:
      tags:
      - v1
      summary: 로그아웃
      description: REFRESH_TOKEN 쿠키의 세션을 폐기하고 ACCESS_TOKEN·REFRESH_TOKEN 쿠키를 만료(Set-Cookie)시킨다.
        쿠키가 없어도 성공으로 응답한다.
      operationId: authLogout
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 만료 처리된 ACCESS_TOKEN·REFRESH_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-logout198252895"
              examples:
                authLogout:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/auth/refresh:
    post:
      tags:
      - v1
      summary: 액세스 토큰 재발급
      description: REFRESH_TOKEN 쿠키의 세션 크리덴셜을 검증해 새 액세스 토큰을 ACCESS_TOKEN 쿠키(Set-Cookie)로
        재발급한다.
      operationId: authRefresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 재발급된 ACCESS_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-logout198252895"
              examples:
                authRefresh:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/members/me:
    get:
      tags:
      - v1
      summary: 내 상태 조회
      description: "인증된 회원의 상태와 프로필 완성 여부를 반환한다. 프로필 미작성이면 profileCompleted=false,\
        \ profile=null 이다. profile 은 필수 프로필 작성 응답의 data 와 동일한 모양이다. FE 는 로그인 직후 이\
        \ 값으로 최초 프로필 작성 모달 노출 여부를 판단한다."
      operationId: memberMe
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me1593439471"
              examples:
                memberMe:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "f3f02860-bb05-4902-b17e-b6465cf82abc",
                        "email" : "user@example.com",
                        "status" : "ACTIVE",
                        "profileCompleted" : false,
                        "profile" : null
                      },
                      "error" : null
                    }
  /v1/nicknames/availability:
    get:
      tags:
      - v1
      summary: 닉네임 사용 가능 여부 확인
      description: 닉네임의 전체 중복 여부를 확인한다. 형식 위반(길이·문자·금칙어)은 available=false 가 아니라 400(E1005)으로
        응답한다.
      operationId: nicknameAvailability
      parameters:
      - name: nickname
        in: query
        description: 확인할 닉네임
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-nicknames-availability-1805856748"
              examples:
                nicknameAvailability:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "available" : true
                      },
                      "error" : null
                    }
  /v1/nicknames/suggestion:
    get:
      tags:
      - v1
      summary: 닉네임 자동 추천
      description: 중복되지 않는 닉네임을 새로 생성해 반환한다. 최초 프로필 모달의 프리필과 ↻ 새로 만들기 재생성에서 사용한다.
      operationId: nicknameSuggestion
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-nicknames-suggestion679533277"
              examples:
                nicknameSuggestion:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "nickname" : "명랑한 알파카 42"
                      },
                      "error" : null
                    }
  /v1/members/me/profile:
    put:
      tags:
      - v1
      summary: 프로필 수정
      description: "마이페이지 수정 폼의 전체 교체 저장. 닉네임은 자신이 쓰던 값을 유지해도 되고, 변경 시 전체 중복을 확인한다\
        . 직무·지역·관심 회사는 카탈로그 참조 id 를 받는다. 형식 위반 400(E1005), 닉네임 중복 409(E1007), 프로필\
        \ 미작성 404(E1009), 존재하지 않는 직무/지역/회사 400(E1301/E1302/E1303)로 응답한다."
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-members-me-profile-835165503"
            examples:
              updateProfile:
                value: |-
                  {
                    "nickname" : "꼼꼼한 라쿤 34",
                    "jobRoleId" : 2,
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "interestCompanyIds" : [ 1, 2 ],
                    "meetingPreference" : "OFFLINE",
                    "sigunguId" : 1
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-profile968366763"
              examples:
                updateProfile:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "38971b0a-21f9-4972-8ba8-861e94b77441",
                        "nickname" : "꼼꼼한 라쿤 34",
                        "jobRoleId" : 2,
                        "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                        "meetingPreference" : "OFFLINE",
                        "sigunguId" : 1,
                        "interestCompanies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        }, {
                          "companyId" : 2,
                          "name" : "한빛커머스"
                        } ],
                        "profileCompleted" : true
                      },
                      "error" : null
                    }
    post:
      tags:
      - v1
      summary: 필수 프로필 작성
      description: "닉네임(필수)과 선택 정보를 받아 프로필을 생성하고 프로필 완성 상태로 전환한다. 직무·지역은 카탈로그 참조 id\
        \ 를 받는다(/v1/job-roles, /v1/regions). 닉네임 형식 위반 400(E1005), 중복 409(E1007),\
        \ 이미 작성된 경우 409(E1008), 필수 약관 미동의 409(E1201), 존재하지 않는 직무/지역 400(E1301/E1302)로\
        \ 응답한다."
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-members-me-profile1474390884"
            examples:
              createProfile:
                value: |-
                  {
                    "nickname" : "꼼꼼한 라쿤 34",
                    "jobRoleId" : 1,
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "meetingPreference" : "BOTH",
                    "sigunguId" : 1
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-profile-400775982"
              examples:
                createProfile:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "21ae6779-af8f-4f52-9c99-e4e29df1b32e",
                        "nickname" : "꼼꼼한 라쿤 34",
                        "jobRoleId" : 1,
                        "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                        "meetingPreference" : "BOTH",
                        "sigunguId" : 1,
                        "interestCompanies" : [ ],
                        "profileCompleted" : true
                      },
                      "error" : null
                    }
  /v1/members/{memberId}/profile:
    get:
      tags:
      - v1
      summary: 공개 프로필 조회
      description: "다른 사용자가 보는 공개 프로필. 공개 범위(닉네임·직무·자기소개)와 신뢰 지표·최근 활동만 노출하고, 이메일·\
        비공개 관심 정보는 담지 않는다. 마이페이지의 신뢰 지표 카드도 이 API(자신의 memberId)로 조회한다. (모킹: 세션·피드백\
        \ 도메인 구현 전까지 figma 목업 값 고정 반환)"
      operationId: publicProfile
      parameters:
      - name: memberId
        in: path
        description: 조회할 회원 식별자 (UUID)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-memberId-profile-573351263"
              examples:
                publicProfile:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "b84461b9-291c-4d16-bdce-ba5f60df336a",
                        "nickname" : "집요한 수달 07",
                        "jobTitle" : "프론트엔드 개발",
                        "bio" : "결제 도메인 3년 차 프론트엔드 개발자예요. 실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                        "stats" : {
                          "completedInterviewCount" : 12,
                          "attendanceRate" : 96,
                          "noShowCount" : 0,
                          "averageRating" : 4.8
                        },
                        "frequentReviews" : [ {
                          "label" : "피드백이 구체적이에요",
                          "count" : 8
                        }, {
                          "label" : "시간을 잘 지켜요",
                          "count" : 6
                        }, {
                          "label" : "질문이 날카로워요",
                          "count" : 5
                        } ],
                        "recentActivities" : [ {
                          "role" : "PARTICIPANT",
                          "title" : "달빛페이 · 프론트엔드 · 1차 면접",
                          "date" : "2026-07-12"
                        }, {
                          "role" : "PARTICIPANT",
                          "title" : "한빛커머스 · 프론트엔드 · 2차 면접",
                          "date" : "2026-06-28"
                        }, {
                          "role" : "HOST",
                          "title" : "구름클라우드 · 프론트엔드 · 최종 면접",
                          "date" : "2026-06-14"
                        } ]
                      },
                      "error" : null
                    }
components:
  schemas:
    v1-companies1839974379:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - companies
          type: object
          properties:
            companies:
              type: array
              description: 검색 결과 (최대 20건)
              items:
                required:
                - companyId
                - name
                type: object
                properties:
                  companyId:
                    type: number
                    description: 회사 id (관심 회사 저장에 사용)
                  name:
                    type: string
                    description: 회사명
    v1-members-me-profile1474390884:
      required:
      - nickname
      type: object
      properties:
        sigunguId:
          type: number
          description: "선호 지역 시군구 id (선택, /v1/regions)"
          nullable: true
        meetingPreference:
          type: string
          description: "진행 방식 선호 (ONLINE | OFFLINE | BOTH, 선택)"
          nullable: true
        nickname:
          type: string
          description: "닉네임 (필수, 전체 중복 불가)"
        bio:
          type: string
          description: 자기소개 (선택)
          nullable: true
        jobRoleId:
          type: number
          description: "직무 id (선택, /v1/job-roles)"
          nullable: true
    v1-nicknames-availability-1805856748:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - available
          type: object
          properties:
            available:
