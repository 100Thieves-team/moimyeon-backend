        를 띄울지 판단하는 데 쓴다. 활성은 모집 중·진행 확정·진행 중이며 취소·완료된 룸은 세지 않는다. 1~2개면 경고만 하고 생성은\
        \ 통과하고, 3개면 생성이 409(E1427)로 거부된다. remaining 은 일정을 여러 개 골라 일괄 생성할 때의 상한이기도\
        \ 하다(§4.4). 존재하지 않는 공고·직무 id 를 보내도 404 가 아니라 0개로 답한다 — 참조 검증은 생성 시점의 일이다."
