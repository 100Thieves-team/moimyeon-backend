openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api.dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-08-27",
                        "datetime" : "2026-08-27T06:18:44.717882446",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-08-27",
                        "datetime" : "2026-08-27T06:18:44.759808829",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/closing-responses:
    post:
      tags:
      - v1
      summary: 클로징 제출
      description: "실제로 받은 모든 원 질문을 평가하고 멱등하게 제출한다. E400, E1405, E1801, E1802, E1803을\
        \ 응답할 수 있다."
