        정·신규 신청·수락이 모두 막힌다(§4.3). 조건은 룸 상세의 confirmation 블록과 같은 판정을 쓴다 — 인원 미달은 E1421,\
        \ 일정 경과는 E1422, 이미 확정·취소·완료·진행 중인 룸은 E1410 이다. 같은 요청을 두 번 보내도 한 번만 처리된다."
