      parameters:
      - name: jobPostingId
        in: query
        description: 채용 공고 id. 회사는 공고에서 파생되므로 따로 받지 않는다
        required: true
        schema:
          type: string
      - name: jobRoleId
        in: query
        description: 직무 id
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-dev-sessions910352763"
              examples:
                roomCreationLimit-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : {
                          "jobPostingId" : "required parameter is missing"
                        }
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms-creation-limit1772486104"
              examples:
                roomCreationLimit:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "activeRoomCount" : 2,
                        "limit" : 3,
                        "remaining" : 1
                      },
                      "error" : null
                    }
