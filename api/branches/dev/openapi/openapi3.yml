  /v1/job-postings/search:
    get:
      tags:
      - v1
      summary: 회사·공고 통합 검색
      description: "회사와 공고를 하나의 검색 바로 찾는다(MOI-390). 탐색 필터와 룸 생성이 같은 응답을 쓰고, 화면이 회사\
        \ 행을 다르게 해석한다. 회사명이 맞아도 공고명이 맞아도 결과는 `회사 | 공고명` 형태의 공고 행으로 통일되며, 회사가 매치되면\
        \ 회사 행도 함께 내려간다. '네이버 백엔드' 처럼 회사와 공고를 함께 친 검색어는 회사로 좁힌 뒤 나머지로 공고를 거른다. 회사가\
        \ 잡히지 않으면 공고명에서 토큰을 AND 로 찾는다(어순 무관). 미검증 공고와 룸이 없는 공고도 포함되고, 결과 수 상한은 서버가\
        \ 고정한다. 타이핑 중 호출을 전제로 하므로 빈 입력·최소 길이 미만은 400 이 아니라 빈 배열 200 이며, 50자 초과만 400(E400)이\
        다. 요청 query 를 그대로 echo 하므로 늦게 도착한 이전 응답을 클라이언트가 버릴 수 있다. 붙여 쓴 검색어('네이버백엔드\
        ')는 분해되지 않아 결과가 없을 수 있다."
      operationId: searchJobPostings
      parameters:
      - name: query
        in: query
        description: 검색어 (최대 50자. 비거나 짧으면 빈 배열)
        required: false
        schema:
          type: string
      - name: companyId
        in: query
        description: 회사 좁히기 (선택). 주면 회사 검색을 건너뛰고 그 회사 안에서만 찾는다
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          headers:
            Cache-Control:
              description: "개인화가 없는 응답이라 캐시를 허용한다 (public, max-age=60)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-postings-search1628359421"
              examples:
                searchJobPostings:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "query" : "네이버 백엔드",
                        "companies" : [ {
                          "companyId" : 91221,
                          "name" : "네이버"
                        } ],
                        "jobPostings" : [ {
                          "jobPostingId" : 2029,
                          "company" : {
                            "companyId" : 91221,
                            "name" : "네이버"
                          },
                          "postingName" : "백엔드 개발자 (정산)",
                          "jobRoleId" : 1,
                          "jobRoleName" : "백엔드 개발",
                          "sourceUrl" : "https://naver.example.com/careers/be",
                          "verified" : true
                        }, {
                          "jobPostingId" : 2036,
                          "company" : {
                            "companyId" : 91222,
                            "name" : "플레이스앤"
                          },
                          "postingName" : "[네이버 계열사] 백엔드 엔지니어",
                          "jobRoleId" : null,
                          "jobRoleName" : null,
                          "sourceUrl" : null,
                          "verified" : false
                        } ]
                      },
                      "error" : null
                    }
                searchJobPostings-empty:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "query" : "",
                        "companies" : [ ],
                        "jobPostings" : [ ]
                      },
                      "error" : null
                    }
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-dev-sessions910352763"
              examples:
                searchJobPostings-e400-length:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
