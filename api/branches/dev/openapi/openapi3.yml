openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api-dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-07-24",
                        "datetime" : "2026-07-24T06:25:55.249143785",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/post191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-07-24",
                        "datetime" : "2026-07-24T06:25:55.468212884",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/terms:
    get:
      tags:
      - v1
      summary: 현재 유효 약관 목록 조회
      description: 현재 유효한(ACTIVE) 약관 전체를 본문 포함으로 반환한다. 로그인 모달의 약관 링크에서 사용하므로 비로그인
        접근을 허용한다.
      operationId: termsList
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-terms1673199050"
              examples:
                termsList:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "terms" : [ {
                          "termsId" : "11111111-1111-1111-1111-111111111111",
                          "type" : "SERVICE",
                          "version" : "v1.0",
                          "title" : "모이면 이용약관",
                          "content" : "제1조(목적) 이 약관은 모이면 서비스의 이용 조건과 절차를 규정합니다. (모킹 본문)",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        }, {
                          "termsId" : "22222222-2222-2222-2222-222222222222",
                          "type" : "PRIVACY",
                          "version" : "v1.0",
                          "title" : "개인정보 처리방침",
                          "content" : "모이면은 회원 가입과 서비스 제공을 위해 최소한의 개인정보를 수집·이용합니다. (모킹 본문)",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        } ]
                      },
                      "error" : null
                    }
  /v1/auth/logout:
    post:
      tags:
      - v1
      summary: 로그아웃
      description: REFRESH_TOKEN 쿠키의 세션을 폐기하고 ACCESS_TOKEN·REFRESH_TOKEN 쿠키를 만료(Set-Cookie)시킨다.
        쿠키가 없어도 성공으로 응답한다.
      operationId: authLogout
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 만료 처리된 ACCESS_TOKEN·REFRESH_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-logout198252895"
              examples:
                authLogout:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/auth/refresh:
    post:
      tags:
      - v1
      summary: 액세스 토큰 재발급
      description: REFRESH_TOKEN 쿠키의 세션 크리덴셜을 검증해 새 액세스 토큰을 ACCESS_TOKEN 쿠키(Set-Cookie)로
        재발급한다.
      operationId: authRefresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 재발급된 ACCESS_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-logout198252895"
              examples:
                authRefresh:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/members/me:
    get:
      tags:
      - v1
      summary: 내 상태 조회
      description: "인증된 회원의 상태와 프로필 완성 여부를 반환한다. 프로필 미작성이면 profileCompleted=false,\
        \ profile=null 이다. profile 은 필수 프로필 작성 응답의 data 와 동일한 모양이다. FE 는 로그인 직후 이\
        \ 값으로 최초 프로필 작성 모달 노출 여부를 판단한다. (모킹: 항상 미작성 상태로 응답)"
      operationId: memberMe
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me1593439471"
              examples:
                memberMe:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "cc02ccd7-143b-4929-8bd8-5af1dbef32a3",
                        "email" : "mock@moimyeon.dev",
                        "status" : "ACTIVE",
                        "profileCompleted" : false,
                        "profile" : null
                      },
                      "error" : null
                    }
  /v1/nicknames/availability:
    get:
      tags:
      - v1
      summary: 닉네임 사용 가능 여부 확인
      description: "닉네임의 전체 중복 여부를 확인한다. 형식 위반(길이·문자)은 available=false 가 아니라 400(E1005)으\
        로 응답한다. (모킹: '집요한 수달 07' 만 false, 나머지는 항상 true)"
      operationId: nicknameAvailability
      parameters:
      - name: nickname
        in: query
        description: 확인할 닉네임
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-nicknames-availability-1805856748"
              examples:
                nicknameAvailability:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "available" : true
                      },
                      "error" : null
                    }
  /v1/nicknames/suggestion:
    get:
      tags:
      - v1
      summary: 닉네임 자동 추천
      description: "중복되지 않는 닉네임을 새로 생성해 반환한다. 최초 프로필 모달의 프리필과 ↻ 새로 만들기 재생성에서 사용한다\
        . (모킹: 항상 '명랑한 알파카 42' 고정 반환)"
      operationId: nicknameSuggestion
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-nicknames-suggestion679533277"
              examples:
                nicknameSuggestion:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "nickname" : "명랑한 알파카 42"
                      },
                      "error" : null
                    }
  /v1/members/me/profile:
    post:
      tags:
      - v1
      summary: 필수 프로필 작성
      description: "닉네임(필수)과 선택 정보를 받아 프로필을 생성하고 프로필 완성 상태로 전환한다. 닉네임 형식 위반은 400(E1005),\
        \ 중복은 409(E1007), 이미 작성된 경우 409(E1008)로 응답한다. (모킹: 저장 없이 요청을 그대로 반환. 중복 E1007\
        \ 은 닉네임 '집요한 수달 07' 로 재현할 수 있고, E1008 은 무상태라 재현 불가 — 실 구현에서 동작한다)"
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-members-me-profile-456488704"
            examples:
              createProfile:
                value: |-
                  {
                    "nickname" : "꼼꼼한 라쿤 34",
                    "jobTitle" : "백엔드 개발",
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "meetingPreference" : "BOTH",
                    "region" : "서울 · 마포구"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-profile-1055246867"
              examples:
                createProfile:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "718e9637-0c2e-4710-aba9-810a12c91b3a",
                        "nickname" : "꼼꼼한 라쿤 34",
                        "jobTitle" : "백엔드 개발",
                        "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                        "meetingPreference" : "BOTH",
                        "region" : "서울 · 마포구",
                        "profileCompleted" : true
                      },
                      "error" : null
                    }
components:
  schemas:
    v1-terms1673199050:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - terms
          type: object
          properties:
            terms:
              type: array
              description: 현재 유효한 약관 목록
              items:
                required:
                - content
                - effectiveFrom
                - required
                - termsId
                - title
                - type
                - version
                type: object
                properties:
                  termsId:
                    type: string
                    description: 약관 버전 식별자 (UUID)
                  title:
                    type: string
                    description: 약관 제목
                  type:
                    type: string
                    description: 약관 종류 (SERVICE | PRIVACY)
                  effectiveFrom:
                    type: string
                    description: 시행일
                  version:
                    type: string
                    description: 약관 버전
                  required:
                    type: boolean
                    description: 가입 필수 동의 여부
                  content:
                    type: string
                    description: 약관 본문
    post-1780624183:
      required:
      - data
      type: object
      properties:
        data:
          type: string
          description: ExampleBody Data Field
    v1-members-me1593439471:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - email
          - memberId
          - profileCompleted
          - status
          type: object
          properties:
            profileCompleted:
              type: boolean
              description: 필수 프로필 작성 완료 여부
            email:
              type: string
              description: 대표 이메일
            status:
              type: string
              description: 회원 상태 (ACTIVE | RESTRICTED | WITHDRAWN)
            memberId:
              type: string
              description: 회원 식별자 (UUID)
    v1-members-me-profile-1055246867:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - memberId
          - nickname
          - profileCompleted
          type: object
          properties:
            meetingPreference:
              type: string
              description: "진행 방식 선호 (ONLINE | OFFLINE | BOTH, 선택)"
              nullable: true
            jobTitle:
              type: string
              description: 직무 (선택)
              nullable: true
            profileCompleted:
              type: boolean
              description: 필수 프로필 작성 완료 여부
            nickname:
              type: string
              description: 닉네임
            bio:
              type: string
              description: 자기소개 (선택)
              nullable: true
            region:
              type: string
              description: 선호 지역 (선택)
              nullable: true
            memberId:
              type: string
              description: 회원 식별자 (UUID)
    v1-nicknames-availability-1805856748:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - available
          type: object
          properties:
            available:
              type: boolean
              description: 사용 가능 여부 (중복이면 false)
    v1-members-me-profile-456488704:
      required:
      - nickname
      type: object
      properties:
        meetingPreference:
          type: string
          description: "진행 방식 선호 (ONLINE | OFFLINE | BOTH, 선택)"
          nullable: true
        jobTitle:
          type: string
          description: 직무 (선택)
          nullable: true
        nickname:
          type: string
          description: "닉네임 (필수, 전체 중복 불가)"
        bio:
          type: string
          description: 자기소개 (선택)
          nullable: true
        region:
          type: string
          description: 선호 지역 (선택)
          nullable: true
    post191457252:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: ResultType
        data:
          required:
          - date
          - datetime
          - items
          - result
          type: object
          properties:
            date:
              type: string
              description: Result Date
            result:
              type: string
              description: Result Data
            datetime:
              type: string
              description: Result Datetime
            items:
              type: array
              description: Result Items
              items:
                required:
                - key
                type: object
                properties:
                  key:
                    type: string
                    description: Result Item
    v1-nicknames-suggestion679533277:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
        data:
          required:
          - nickname
          type: object
          properties:
            nickname:
              type: string
              description: 추천 닉네임 (중복 아님 보장)
    v1-auth-logout198252895:
      required:
      - result
      type: object
      properties:
        result:
          type: string
          description: 처리 결과 (SUCCESS)
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorization/google
          tokenUrl: /login/oauth2/code/google
          scopes: {}
