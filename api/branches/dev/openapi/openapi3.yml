  /v1/rooms/{roomId}/applications/{applicationId}/accept:
    post:
      tags:
      - v1
      summary: 참가 신청 수락
      description: "방장이 대기 중인 신청을 수락한다(「룸 참여」 §4.4). 서버가 정원을 최종 확인한 뒤 신청자를 참여자로 등록\
        하고 현재 인원을 증가시킨다. 정원에 도달하면 모집 상태가 마감(CLOSED)으로 계산된다. 마지막 자리를 두고 동시 수락이 몰려도\
        \ 1건만 성공한다(룸 행 잠금). 방장만 처리할 수 있고(E1406), 이미 처리된 신청(E1409)·모집 중이 아닌 방(E1410)·\
        정원 초과(E1411)는 거부된다. 신청자의 참여 슬롯이 이미 차 있으면(참여 중인 룸 3개, 「룸 참여」 §4.1) 참여자로 등록하\
        지 않고 그 신청을 SLOT_EXCEEDED 로 정리한다. 방장의 요청은 실패하지 않으므로 200 이며, 결과는 status 로 구분\
        한다."
      operationId: acceptApplication
      parameters:
      - name: roomId
        in: path
        description: 룸 id (UUID)
        required: true
        schema:
          type: string
      - name: applicationId
        in: path
        description: 수락할 신청 id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms-roomId-applications-applicationId-accept-674159690"
              examples:
                acceptApplication:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "applicationId" : 3001,
                        "status" : "ACCEPTED",
                        "statusLabel" : "수락",
                        "recruit" : {
                          "current" : 2,
                          "max" : 6,
                          "recruitStatus" : "RECRUITING",
                          "recruitStatusLabel" : "모집 중"
                        }
                      },
                      "error" : null
                    }
  /v1/rooms/{roomId}/applications/{applicationId}/reject:
    post:
      tags:
      - v1
      summary: 참가 신청 반려
      description: "방장이 대기 중인 신청을 반려한다(§4.4). 사유는 선택(최대 50자)이며, 반려는 정원·참여자 목록에 영향이\
        \ 없다. 반려된 사용자는 같은 룸에 재신청할 수 없다. 방장만 처리할 수 있다(E1406)."
      operationId: rejectApplication
      parameters:
      - name: roomId
        in: path
        description: 룸 id (UUID)
        required: true
        schema:
          type: string
      - name: applicationId
        in: path
        description: 반려할 신청 id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-rooms-roomId-applications-applicationId-reject2120301028"
            examples:
              rejectApplication:
                value: |-
                  {
                    "reason" : "이번 일정과 준비 방향이 맞지 않아요."
                  }
      responses:
        "200":
          description: "200"
          content:
