                      "durationMinutes" : 90
                    },
                    "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                    "description" : "실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.",
                    "resumeId" : "01920000-0000-7000-8000-000000000101",
                    "resumePublic" : true
                  }
              createRoom-e1402-max-participants:
                value: |-
                  {
                    "postingId" : 1,
                    "jobRoleId" : 1,
                    "round" : "FIRST",
                    "type" : "JOB",
                    "method" : "OFFLINE",
                    "sigunguId" : 1,
                    "minParticipants" : 3,
                    "maxParticipants" : 9,
                    "schedule" : {
                      "date" : "2026-08-01",
                      "startTime" : "14:00",
                      "durationMinutes" : 90
                    },
                    "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                    "description" : "실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.",
                    "resumeId" : "01920000-0000-7000-8000-000000000101",
                    "resumePublic" : true
                  }
              createRoom:
                value: |-
                  {
                    "postingId" : 1,
                    "jobRoleId" : 1,
                    "round" : "FIRST",
                    "type" : "JOB",
                    "method" : "OFFLINE",
                    "sigunguId" : 1,
                    "minParticipants" : 3,
                    "maxParticipants" : 6,
                    "schedule" : {
                      "date" : "2026-08-01",
                      "startTime" : "14:00",
                      "durationMinutes" : 90
                    },
