  /v1/rooms:
    get:
      tags:
      - v1
      summary: 룸 탐색 목록 조회
      description: "조건에 맞는 모집 중인 룸 목록을 조회한다(「룸 탐색」 §4.1~§4.3). 비로그인도 조회할 수 있다. 필터는\
        \ AND 로 결합하고, 완료·취소·일정 경과 룸은 제외된다. 커서 페이지네이션이며 nextCursor 가 null 이면 마지막 페이\
        지다. 커서는 불투명 토큰이라 해석하지 말고 그대로 다시 보낸다. 잘못된 필터·정렬 값은 그 값만 무시하고 나머지 조건으로 조회한다\
        . 회사·공고·직무·지역 표시명은 참조가 끊어졌을 때(회사 미매칭 공고, 폐기된 직무 등) null 로 내려가고 룸 자체는 목록에 남\
        는다."
      operationId: rooms
      parameters:
      - name: companyId
        in: query
        description: 회사 id 필터 (선택). 그 회사의 공고로 만든 룸만 남는다
        required: false
        schema:
          type: string
      - name: jobPostingId
        in: query
        description: 채용 공고 id 필터 (선택). 회사와 함께 주면 둘을 모두 만족하는 공고만 남는다
        required: false
        schema:
          type: string
      - name: jobRoleId
        in: query
        description: 직무 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: round
        in: query
        description: "면접 단계 필터 (FIRST | SECOND | THIRD | ETC, 선택). 지원하지 않는 값은 이 조건\
          만 무시한다"
        required: false
        schema:
          type: string
      - name: method
        in: query
        description: "진행 방식 필터 (ONLINE | OFFLINE, 선택). 지원하지 않는 값은 이 조건만 무시한다"
        required: false
        schema:
          type: string
      - name: sigunguId
        in: query
        description: 오프라인 지역 시군구 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: startFrom
        in: query
        description: "조회 시작 일시 (ISO-8601, 선택). 시간까지 포함한 한 구간이다"
        required: false
        schema:
          type: string
      - name: startTo
        in: query
        description: "조회 종료 일시 (ISO-8601, 선택). 시작보다 앞서면 400 이다"
        required: false
        schema:
          type: string
      - name: availableOnly
        in: query
        description: 참여 가능한 룸만 보기 토글 (기본 false)
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 (SCHEDULE 일정 빠른 순 | RECENT 최근 생성순, 기본 SCHEDULE). 지원하지 않는\
          \ 값은 기본 정렬로 처리한다"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor (선택). 정렬을 바꾸면 버리고 처음부터 조회한다
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "페이지 크기 (1~50, 기본 20). 범위 밖이면 기본값으로 조회한다"
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-dev-sessions910352763"
              examples:
                rooms-e400-cursor:
                  value: |-
