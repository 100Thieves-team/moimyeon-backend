openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api.dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-08-13",
                        "datetime" : "2026-08-13T14:28:01.942085684",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-08-13",
                        "datetime" : "2026-08-13T14:28:02.14572524",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: "관심 회사 태그 입력의 검색 소스. 정규화된 회사명의 접두 일치로 검증 완료된 유효(미폐기) 회사를 최대 20건\
        \ 반환한다. 접두로 찾지 못하면 부분 일치로 다시 찾는다(예: '올리브영' 으로 'CJ올리브영'). 타이핑 중 호출을 전제로 하므로\
        \ 빈 검색어는 빈 배열 200 이고, 50자 초과만 400(E400)이다."
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (정규화 회사명 접두 일치, 최대 50자. 비면 빈 배열)"
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                searchCompanies-e400-length:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
  /v1/job-postings:
    post:
      tags:
      - v1
      summary: 채용 공고 즉시 생성
      description: "링크로 공고를 즉시 생성한다(§4.1). 승인 대기 없이 verified=false 로 만들어져 바로 룸 생성에\
        \ 사용할 수 있다. 회사는 기존 카탈로그 회사 id 로 받고, 공고명은 사용자가 확정한 값을 쓰며, 생성자는 인증 회원으로 기록된다\
        . 같은 URL 재요청은 새로 만들지 않고 기존 공고를 돌려준다(멱등). companyId·url·postingName 누락·형식 오\
        류는 400(E400), 존재하지 않는 회사는 400(E1303), 미인증은 401(E1102)."
      operationId: createJobPosting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-job-postings-1848070641"
            examples:
              createJobPosting-e400:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "   "
                  }
              createJobPosting:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                  }
              createJobPosting-e1102:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345",
                    "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                createJobPosting-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-postings1538643122"
              examples:
                createJobPosting:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "jobPostingId" : 90101,
                        "companyId" : 43429,
                        "postingName" : "프론트엔드 개발자 (결제플랫폼)",
                        "sourceUrl" : "https://company.example.com/careers/12345",
                        "verified" : false
                      },
                      "error" : null
                    }
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                createJobPosting-e1102:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1102",
                        "message" : "인증이 필요합니다.",
                        "data" : null
                      }
                    }
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-roles-1436485238"
              examples:
                jobRoles:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "groups" : [ {
                          "code" : "IT_개발",
                          "displayName" : "IT·개발",
                          "roles" : [ {
                            "jobRoleId" : 1,
                            "code" : "서버_백엔드",
                            "displayName" : "서버·백엔드"
                          }, {
                            "jobRoleId" : 2,
                            "code" : "프론트엔드",
                            "displayName" : "프론트엔드"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 오프라인 룸 지역 선택 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가 관리하는
        참조 데이터다.
      operationId: regions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-regions709600108"
              examples:
                regions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "sidos" : [ {
                          "name" : "서울특별시",
                          "shortName" : "서울",
                          "sigungus" : [ {
                            "sigunguId" : 1,
                            "name" : "강남구"
                          }, {
                            "sigunguId" : 2,
                            "name" : "마포구"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/rooms:
    get:
      tags:
      - v1
      summary: 룸 탐색 목록 조회
      description: "조건에 맞는 모집 중인 룸 목록을 조회한다(「룸 탐색」 §4.1~§4.3). 비로그인도 조회할 수 있다. 필터는\
        \ AND 로 결합하고, 완료·취소·일정 경과 룸은 제외된다. 커서 페이지네이션이며 nextCursor 가 null 이면 마지막 페이\
        지다. 커서는 불투명 토큰이라 해석하지 말고 그대로 다시 보낸다. 잘못된 필터·정렬 값은 그 값만 무시하고 나머지 조건으로 조회한다\
        . 회사·공고·직무·지역 표시명은 참조가 끊어졌을 때(회사 미매칭 공고, 폐기된 직무 등) null 로 내려가고 룸 자체는 목록에 남\
        는다."
      operationId: rooms
      parameters:
      - name: companyId
        in: query
        description: 회사 id 필터 (선택). 그 회사의 공고로 만든 룸만 남는다
        required: false
        schema:
          type: string
      - name: jobPostingId
        in: query
        description: 채용 공고 id 필터 (선택). 회사와 함께 주면 둘을 모두 만족하는 공고만 남는다
        required: false
        schema:
          type: string
      - name: jobRoleId
        in: query
        description: 직무 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: round
        in: query
        description: "면접 단계 필터 (FIRST | SECOND | THIRD | ETC, 선택). 지원하지 않는 값은 이 조건\
          만 무시한다"
        required: false
        schema:
          type: string
      - name: method
        in: query
        description: "진행 방식 필터 (ONLINE | OFFLINE, 선택). 지원하지 않는 값은 이 조건만 무시한다"
        required: false
        schema:
          type: string
      - name: sigunguId
        in: query
        description: 오프라인 지역 시군구 id 필터 (선택)
        required: false
        schema:
          type: string
      - name: startFrom
        in: query
        description: "조회 시작 일시 (ISO-8601, 선택). 시간까지 포함한 한 구간이다"
        required: false
        schema:
          type: string
      - name: startTo
        in: query
        description: "조회 종료 일시 (ISO-8601, 선택). 시작보다 앞서면 400 이다"
        required: false
        schema:
          type: string
      - name: availableOnly
        in: query
        description: 참여 가능한 룸만 보기 토글 (기본 false)
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 (SCHEDULE 일정 빠른 순 | RECENT 최근 생성순, 기본 SCHEDULE). 지원하지 않는\
          \ 값은 기본 정렬로 처리한다"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor (선택). 정렬을 바꾸면 버리고 처음부터 조회한다
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "페이지 크기 (1~50, 기본 20). 범위 밖이면 기본값으로 조회한다"
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                rooms-e400-cursor:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-rooms1476531183"
              examples:
                rooms:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "rooms" : [ {
                          "roomId" : "01920000-0000-7000-8000-000000000001",
                          "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                          "company" : {
                            "companyId" : 1,
                            "name" : "달빛페이"
                          },
                          "jobPosting" : {
                            "jobPostingId" : 1,
                            "postingName" : "프론트엔드 개발자 (결제플랫폼)"
                          },
                          "jobRole" : {
                            "jobRoleId" : 1,
                            "code" : "FRONTEND_DEVELOPER",
                            "displayName" : "프론트엔드 개발"
                          },
                          "round" : "FIRST",
                          "roundLabel" : "1차",
                          "type" : "JOB",
                          "typeLabel" : "직무 면접",
                          "method" : "OFFLINE",
                          "methodLabel" : "오프라인",
                          "region" : {
                            "sigunguId" : 1,
                            "label" : "서울 강남구"
                          },
                          "schedule" : {
                            "date" : "2026-09-05",
                            "startTime" : "14:00",
                            "durationMinutes" : 90
                          },
                          "recruit" : {
                            "current" : 3,
                            "max" : 8,
                            "pending" : 5,
                            "recruitStatus" : "RECRUITING",
                            "recruitStatusLabel" : "모집 중"
                          },
                          "viewer" : {
                            "relation" : "NONE",
                            "actions" : [ "APPLY" ],
                            "blockReason" : null
                          }
                        } ],
                        "sort" : "SCHEDULE",
                        "totalCount" : 1,
                        "nextCursor" : "djE6U0NIRURVTEU6MjAyNi0wOS0wNVQxNDowMDowMTIzNA"
                      },
                      "error" : null
                    }
    post:
      tags:
      - v1
      summary: 룸 생성
      description: 생성 위저드(「룸 생성」 §4.1~§4.8)의 입력을 한 번에 받아 룸을 만들고 즉시 모집(RECRUITING)
        상태로 등록한다(§4.8). 공고를 고르면 회사가 함께 확정되므로 룸에는 회사를 따로 저장하지 않는다(공고 → 회사 파생). 직무·지역·이력서는
        카탈로그/보관함 참조 id 를 받는다. 더블클릭·재시도로 같은 요청이 중복 전송되면 룸을 새로 만들지 않고 이미 만들어진 룸을 그대로
        돌려준다 — 같은 방장의 같은 공고·직무·시각이면 같은 룸으로 본다. 이때 status 는 그 룸의 현재 상태라 RECRUITING
        이 아닐 수 있다.
      operationId: createRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-rooms897804324"
            examples:
              createRoom-e1402:
                value: |-
                  {
                    "postingId" : 1,
                    "jobRoleId" : 1,
                    "round" : "FIRST",
                    "type" : "JOB",
                    "method" : "OFFLINE",
                    "sigunguId" : 1,
                    "minParticipants" : 3,
                    "maxParticipants" : 2,
                    "schedule" : {
                      "date" : "2026-08-01",
                      "startTime" : "14:00",
                      "durationMinutes" : 90
                    },
                    "title" : "달빛페이 프론트 1차, 실전처럼 봐요",
                    "description" : "실제 1차 면접 형식 그대로 진행해요. 결제·정산 도메인 위주로 준비할게요.",
                    "resumeId" : "01920000-0000-7000-8000-000000000101",
                    "resumePublic" : true
                  }
              createRoom-e1402-min-participants:
                value: |-
                  {
                    "postingId" : 1,
                    "jobRoleId" : 1,
                    "round" : "FIRST",
                    "type" : "JOB",
                    "method" : "OFFLINE",
                    "sigunguId" : 1,
                    "minParticipants" : 1,
                    "maxParticipants" : 6,
                    "schedule" : {
