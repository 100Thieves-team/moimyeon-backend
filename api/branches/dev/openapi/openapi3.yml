      tags:
      - v1
      summary: 참여 슬롯 여유분 조회
      description: "내가 참여 중인 룸이 몇 개고 몇 개 더 참여할 수 있는지 돌려준다(「룸 참여」 §4.1, 방장 포함). 활성\
        \ 룸(모집 중 · 진행 확정 · 진행 중)의 참여만 세고 취소 · 완료된 룸과 처리 대기 중인 신청은 세지 않는다. remaining\
        \ 이 0 이면 신규 신청 · 수락 · 룸 생성이 모두 409(E1425)로 거부된다. 일정을 여러 개 골라 룸을 일괄 생성할 때의\
        \ 최대 선택 수는 화면이 min(중복 생성 제한 remaining, 이 remaining) 으로 계산한다(「룸 생성」 §4.4).\
        \ 서버가 min 을 합쳐 주지 않는다: 어느 한도에 걸렸는지에 따라 안내 문구가 갈린다."
