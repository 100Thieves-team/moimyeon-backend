  /v1/job-postings/link-metadata:
    post:
      tags:
      - v1
      summary: 채용 공고 링크 메타데이터 조회
      description: "목록에 없는 공고를 만들기 전, 링크의 OG 태그를 서버가 읽어 공고명 후보와 미리보기(이미지·설명·출처)를 돌\
        려준다(§4.1). 브라우저는 CORS 로 외부 페이지를 직접 못 읽어 서버가 대신 fetch 한다. 사용자가 고른 companyId\
        \ 를 함께 받아 '이 링크는 그 회사의 공고'라고 일단 가정하고 그대로 돌려준다(링크·회사 일치나 회사 실존은 미리보기에서 검증하지\
        \ 않음, 생성에서 검증). fetch 실패·OG 없음·봇 차단·타임아웃이면 postingName 이 null 로 내려가고, 사용자는\
        \ 공고명을 직접 입력해 생성으로 넘어간다. companyId 누락(양수 아님)·url 형식 오류(http/https 아님)는 400(E400)."
      operationId: jobPostingLinkMetadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-job-postings-link-metadata34312967"
            examples:
              jobPostingLinkMetadata-e400:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "ftp://company.example.com/careers"
                  }
              jobPostingLinkMetadata:
                value: |-
                  {
                    "companyId" : 43429,
                    "url" : "https://company.example.com/careers/12345"
                  }
