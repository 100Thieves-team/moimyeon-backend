  /v1/members/me/resumes/{resumeId}/summary-retries:
    post:
      tags:
      - v1
      summary: AI 이력서 요약 재시도
      description: "AI 요약이 FAILED인 이력서만 재시도한다. 저장된 S3 원본으로 Bedrock 요약을 동기 실행하고 DONE\
        \ 또는 FAILED 결과를 반환한다. 1분을 넘긴 PROCESSING은 먼저 FAILED로 확정하며 백그라운드에서 자동 재시도하지\
        \ 않는다. 이미 PROCESSING이거나 DONE인 요약은 409(E1013), 존재하지 않거나 본인 소유가 아닌 이력서는 404(E1010)로\
        \ 응답한다."
