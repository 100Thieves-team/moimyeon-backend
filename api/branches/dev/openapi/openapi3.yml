  /v1/members/{memberId}/profile:
    get:
      tags:
      - v1
      summary: 공개 프로필 조회
      description: "다른 사용자가 보는 공개 프로필. 공개 범위(닉네임·직무·자기소개)와 신뢰 지표·최근 활동만 노출하고, 이메일·\
        비공개 관심 정보는 담지 않는다. 마이페이지의 신뢰 지표 카드도 이 API(자신의 memberId)로 조회한다. (모킹: 세션·피드백\
        \ 도메인 구현 전까지 figma 목업 값 고정 반환)"
      operationId: publicProfile
      parameters:
      - name: memberId
        in: path
        description: 조회할 회원 식별자 (UUID)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-memberId-profile-573351263"
              examples:
                publicProfile:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
