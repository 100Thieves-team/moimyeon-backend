  /oauth2/authorization/google:
    get:
      operationId: googleOAuthStart
      summary: Google OAuth2 로그인 시작
      description: 브라우저 전체 페이지 이동으로 호출한다. 서버는 Google 동의 화면으로 302 리다이렉트한다.
      tags:
      - Auth
      security: []
      responses:
        "302":
          description: Google OAuth2 인가 엔드포인트로 이동
          headers:
            Location:
              description: 리다이렉트 대상 URI
              required: true
              schema:
                type: string
                format: uri
  /login/oauth2/code/google:
    get:
      operationId: googleOAuthCallback
      summary: Google OAuth2 로그인 콜백
      description: Google 전용 콜백이다. 성공하면 ACCESS_TOKEN·REFRESH_TOKEN 쿠키를 함께 발급한 뒤 프론트
        성공 콜백으로 이동한다. Google 거절·state 검증 실패 또는 회원·세션 처리 실패 시 새 인증 쿠키 없이 고정된 프론트 실패
        URL로 이동하며 내부 원인은 노출하지 않는다.
      tags:
      - Auth
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: Google 인가 코드. 성공 콜백에서 전달
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: 로그인 요청 위변조 방지 상태값
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Google 실패 코드. 클라이언트로 전달하지 않음
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        description: Google 실패 상세. 로그·프론트 리다이렉트에 원문을 노출하지 않음
        schema:
          type: string
      responses:
        "302":
          description: 성공 콜백 또는 고정된 실패 화면으로 이동
          headers:
            Location:
              description: 리다이렉트 대상 URI
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: 성공 시 ACCESS_TOKEN과 REFRESH_TOKEN 두 헤더. 실패 시 발급하지 않음
              schema:
                type: array
                items:
                  type: string
