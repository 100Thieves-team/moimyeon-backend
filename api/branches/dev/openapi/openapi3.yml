        \ 상태를 신청 시각 오름차순으로 내려준다. 철회된 신청은 제외된다. 전달 사항은 방장 외 비공개이며, 이력서 원본으로 가는 경로는\
        \ 없다(§6). 방장만 조회할 수 있다(E1406). 관심 직무는 목록으로 제공한다. 공개 활동 정보는 이 목록에서는 null이며\
        \ 공개 프로필 API에서 조회한다."
