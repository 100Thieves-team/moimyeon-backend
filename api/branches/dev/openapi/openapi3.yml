  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: "관심 회사 태그 입력의 검색 소스. 정규화된 회사명의 접두 일치로 검증 완료된 유효(미폐기) 회사를 최대 20건\
        \ 반환한다. 접두로 찾지 못하면 부분 일치로 다시 찾는다(예: '올리브영' 으로 'CJ올리브영'). 타이핑 중 호출을 전제로 하므로\
        \ 빈 검색어는 빈 배열 200 이고, 50자 초과만 400(E400)이다."
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (정규화 회사명 접두 일치, 최대 50자. 비면 빈 배열)"
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-auth-dev-sessions910352763"
              examples:
                searchCompanies-e400-length:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
