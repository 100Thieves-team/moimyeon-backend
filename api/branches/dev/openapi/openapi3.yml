openapi: 3.0.1
info:
  title: Moimyeon API
  description: "Moimyeon REST API contract generated from Spring REST Docs. 로그인은 Google\
    \ OAuth2 리다이렉트 플로우로 시작하며(GET /oauth2/authorization/google), 성공 시 ACCESS_TOKEN·\
    REFRESH_TOKEN 쿠키가 발급된다. API 인증은 ACCESS_TOKEN 쿠키 또는 Authorization: Bearer 헤더 둘\
    \ 다 허용한다."
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
- url: https://api.dev.moimyeon.plady.io
tags: []
paths:
  /get/{exampleValue}:
    get:
      tags:
      - get
      summary: 예제 조회
      description: 경로/쿼리 파라미터를 받아 예제 데이터를 조회한다.
      operationId: exampleGet
      parameters:
      - name: exampleValue
        in: path
        description: ExampleValue
        required: true
        schema:
          type: string
      - name: exampleParam
        in: query
        description: ExampleParam
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                exampleGet:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_GET",
                        "date" : "2026-07-29",
                        "datetime" : "2026-07-29T16:19:20.441766109",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /post:
    post:
      tags:
      - post
      summary: 예제 등록
      description: 예제 데이터를 받아 처리 결과를 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/post-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/get-exampleValue191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-07-29",
                        "datetime" : "2026-07-29T16:19:20.6851234",
                        "items" : [ {
                          "key" : "1"
                        }, {
                          "key" : "2"
                        } ]
                      },
                      "error" : null
                    }
  /v1/companies:
    get:
      tags:
      - v1
      summary: 회사 검색
      description: 관심 회사 태그 입력의 검색 소스. 회사명 부분 일치로 유효(미폐기) 회사를 최대 20건 반환한다. 크롤러가 관리하는
        참조 데이터다. 검색어가 없거나 1~50자를 벗어나면 400(E400)으로 응답한다.
      operationId: searchCompanies
      parameters:
      - name: query
        in: query
        description: "검색어 (회사명 부분 일치, 1~50자)"
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                searchCompanies-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : {
                          "query" : "size must be between 1 and 50"
                        }
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-companies1839974379"
              examples:
                searchCompanies:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "companies" : [ {
                          "companyId" : 1,
                          "name" : "달빛페이"
                        } ]
                      },
                      "error" : null
                    }
  /v1/job-roles:
    get:
      tags:
      - v1
      summary: 직무 카탈로그 조회
      description: 프로필 직무 드롭다운 소스. 직군별로 그룹핑된 유효(미폐기) 직무 목록을 반환한다. 크롤러가 관리하는 참조 데이터다.
      operationId: jobRoles
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-job-roles-1436485238"
              examples:
                jobRoles:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "groups" : [ {
                          "code" : "IT_개발",
                          "displayName" : "IT·개발",
                          "roles" : [ {
                            "jobRoleId" : 1,
                            "code" : "서버_백엔드",
                            "displayName" : "서버·백엔드"
                          }, {
                            "jobRoleId" : 2,
                            "code" : "프론트엔드",
                            "displayName" : "프론트엔드"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/regions:
    get:
      tags:
      - v1
      summary: 지역 카탈로그 조회
      description: 프로필 선호 지역 드롭다운 소스. 시도별로 그룹핑된 유효(미폐기) 시군구 목록을 반환한다(법정동 기준). 크롤러가
        관리하는 참조 데이터다.
      operationId: regions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-regions1871099627"
              examples:
                regions:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "sidos" : [ {
                          "name" : "서울특별시",
                          "shortName" : "서울",
                          "sigungus" : [ {
                            "sigunguId" : 1,
                            "name" : "강남구"
                          }, {
                            "sigunguId" : 2,
                            "name" : "마포구"
                          } ]
                        } ]
                      },
                      "error" : null
                    }
  /v1/terms:
    get:
      tags:
      - v1
      summary: 현재 유효 약관 목록 조회
      description: 현재 유효한(ACTIVE) 약관 전체를 본문 포함으로 반환한다. 로그인 모달의 약관 링크에서 사용하므로 비로그인
        접근을 허용한다.
      operationId: termsList
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-terms1673199050"
              examples:
                termsList:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "terms" : [ {
                          "termsId" : "1bbb0cd6-5420-49ab-b9ae-872020d495ff",
                          "type" : "SERVICE",
                          "version" : "v1.0",
                          "title" : "모이면 이용약관",
                          "content" : "제1조(목적) 이 약관은 모이면 서비스의 이용 조건과 절차를 규정합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        }, {
                          "termsId" : "d9bb025a-a900-4e2b-9ba2-0268b55c65b2",
                          "type" : "PRIVACY",
                          "version" : "v1.0",
                          "title" : "개인정보 처리방침",
                          "content" : "모이면은 회원 가입과 서비스 제공을 위해 최소한의 개인정보를 수집·이용합니다.",
                          "required" : true,
                          "effectiveFrom" : "2026-07-01T00:00:00"
                        } ]
                      },
                      "error" : null
                    }
  /v1/auth/logout:
    post:
      tags:
      - v1
      summary: 로그아웃
      description: REFRESH_TOKEN 쿠키의 세션을 폐기하고 ACCESS_TOKEN·REFRESH_TOKEN 쿠키를 만료(Set-Cookie)시킨다.
        쿠키가 없어도 성공으로 응답한다.
      operationId: authLogout
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 만료 처리된 ACCESS_TOKEN·REFRESH_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                authLogout:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
  /v1/auth/refresh:
    post:
      tags:
      - v1
      summary: 액세스 토큰 재발급
      description: "REFRESH_TOKEN 쿠키의 세션 크리덴셜을 검증해 새 액세스 토큰을 ACCESS_TOKEN 쿠키(Set-Cookie)로\
        \ 재발급한다. 쿠키가 없거나 세션이 만료·폐기됐으면 401(E1104)로 응답하며, FE 는 재로그인으로 보낸다."
      operationId: authRefresh
      responses:
        "200":
          description: "200"
          headers:
            Set-Cookie:
              description: 재발급된 ACCESS_TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                authRefresh:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                authRefresh-e1104:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1104",
                        "message" : "세션이 유효하지 않습니다. 다시 로그인해주세요.",
                        "data" : null
                      }
                    }
  /v1/members/me:
    get:
      tags:
      - v1
      summary: 내 상태 조회
      description: "인증된 회원의 상태와 프로필 완성 여부를 반환한다. 닉네임은 가입 시 자동 부여되는 회원 속성이다. 프로필(소개\
        ) 미작성이면 profileCompleted=false, profile=null 이다. profile 은 필수 프로필 작성 응답의 data\
        \ 와 동일한 모양이다. FE 는 로그인 직후 이 값으로 최초 프로필 작성 모달 노출 여부를 판단한다. 액세스 토큰이 없거나 유효하지\
        \ 않으면 401(E1102), 토큰은 유효하지만 회원이 조회되지 않으면(탈퇴 등) 404(E1006)로 응답한다."
      operationId: memberMe
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-766176819"
              examples:
                memberMe:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "memberId" : "bfe7181d-3198-4c0c-a3bb-a5f4eb4bba3a",
                        "email" : "user@example.com",
                        "nickname" : "차분한 펭귄 12",
                        "status" : "ACTIVE",
                        "profileCompleted" : false,
                        "profile" : null
                      },
                      "error" : null
                    }
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                memberMe-e1006:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1006",
                        "message" : "회원을 찾을 수 없습니다.",
                        "data" : null
                      }
                    }
        "401":
          description: "401"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                memberMe-e1102:
                  value: |-
                    {
                      "data" : null,
                      "error" : {
                        "code" : "E1102",
                        "data" : null,
                        "message" : "인증이 필요합니다."
                      },
                      "result" : "ERROR"
                    }
  /v1/nicknames/availability:
    get:
      tags:
      - v1
      summary: 닉네임 사용 가능 여부 확인
      description: "닉네임의 전체 중복 여부를 확인한다. 형식 위반(길이·문자·금칙어)은 available=false 가 아니라 400(E1005)으\
        로, 필수 쿼리 파라미터(nickname) 누락은 400(E400)으로 응답한다."
      operationId: nicknameAvailability
      parameters:
      - name: nickname
        in: query
        description: 확인할 닉네임
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                nicknameAvailability-e400:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E400",
                        "message" : "요청 형식이 올바르지 않습니다.",
                        "data" : {
                          "nickname" : "required parameter is missing"
                        }
                      }
                    }
                nicknameAvailability-e1005:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1005",
                        "message" : "닉네임 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-nicknames-availability-1805856748"
              examples:
                nicknameAvailability:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "available" : true
                      },
                      "error" : null
                    }
  /v1/nicknames/suggestion:
    get:
      tags:
      - v1
      summary: 닉네임 자동 추천
      description: 중복되지 않는 닉네임을 새로 생성해 반환한다. 닉네임 변경 폼의 ↻ 새로 만들기 재생성에서 사용한다.
      operationId: nicknameSuggestion
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-nicknames-suggestion679533277"
              examples:
                nicknameSuggestion:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "nickname" : "명랑한 알파카 42"
                      },
                      "error" : null
                    }
  /v1/members/me/nickname:
    put:
      tags:
      - v1
      summary: 닉네임 변경
      description: "회원의 닉네임을 변경한다. 자신이 쓰던 닉네임 유지는 허용하고, 변경 시 전체 중복을 확인한다. 형식 위반 400(E1005),\
        \ 인증 정보 없음·무효 401(E1102), 닉네임 중복 409(E1007)로 응답한다."
      operationId: updateNickname
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-members-me-nickname-346517390"
            examples:
              updateNickname:
                value: |-
                  {
                    "nickname" : "명랑한 해달 33"
                  }
              updateNickname-e1005:
                value: |-
                  {
                    "nickname" : "금지문자!@#"
                  }
              updateNickname-e1102:
                value: |-
                  {
                    "nickname" : "명랑한 해달 33"
                  }
              updateNickname-e1007:
                value: |-
                  {
                    "nickname" : "명랑한 해달 33"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname198252895"
              examples:
                updateNickname:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : null,
                      "error" : null
                    }
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                updateNickname-e1005:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1005",
                        "message" : "닉네임 형식이 올바르지 않습니다.",
                        "data" : null
                      }
                    }
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                updateNickname-e1102:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1102",
                        "message" : "인증이 필요합니다.",
                        "data" : null
                      }
                    }
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-nickname910352763"
              examples:
                updateNickname-e1007:
                  value: |-
                    {
                      "result" : "ERROR",
                      "data" : null,
                      "error" : {
                        "code" : "E1007",
                        "message" : "이미 사용 중인 닉네임입니다.",
                        "data" : null
                      }
                    }
  /v1/members/me/profile:
    put:
      tags:
      - v1
      summary: 프로필 수정
      description: "마이페이지 수정 폼의 전체 교체 저장. 직무·지역·관심 회사는 카탈로그 참조 id 를 받는다. 요청 형태 오류\
        \ 400(E400), 존재하지 않는 직무/지역/회사 400(E1301/E1302/E1303), 인증 정보 없음·무효 401(E1102),\
        \ 프로필 미작성 404(E1009)로 응답한다."
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1-members-me-profile-69778644"
            examples:
              updateProfile:
                value: |-
                  {
                    "jobRoleId" : 2,
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "interestCompanyIds" : [ 1, 2 ],
                    "meetingPreference" : "OFFLINE",
                    "sigunguId" : 1
                  }
              updateProfile-e1102:
                value: |-
                  {
                    "jobRoleId" : 2,
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "interestCompanyIds" : [ 1, 2 ],
                    "meetingPreference" : "OFFLINE",
                    "sigunguId" : 1
                  }
              updateProfile-e1009:
                value: |-
                  {
                    "jobRoleId" : 2,
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "interestCompanyIds" : [ 1, 2 ],
                    "meetingPreference" : "OFFLINE",
                    "sigunguId" : 1
                  }
              updateProfile-e1303:
                value: |-
                  {
                    "jobRoleId" : 2,
                    "bio" : "실전처럼 압박 질문을 주고받는 걸 좋아해요.",
                    "interestCompanyIds" : [ 1, 2 ],
                    "meetingPreference" : "OFFLINE",
                    "sigunguId" : 1
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-members-me-profile-1915001008"
              examples:
                updateProfile:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
