  /v1/members/me/resumes:
    get:
      tags:
      - v1
      summary: 보관 이력서 목록 조회
      description: "인증 회원의 보관 이력서를 마이페이지·룸 생성·참가 신청에서 함께 사용할 수 있는 동일한 자원 형태로 반환한다\
        . 삭제한 이력서는 목록에서 제외하고 최근 사용순으로 보여준다. 기본 이력서 여부는 최근 사용과 별개로 반환한다. 최대 보관 개수는\
        \ 최신 PRD 기준 10개다. 신청 화면에서는 선택지를 열 때 조회하며 개별 AI 요약 상태를 확인하는 폴링에는 단건 조회 API를\
        \ 사용한다. AI 요약은 DONE·PROCESSING·FAILED 상태를 가지며 준비 중이면 text가 null이다. PROCESSING은\
        \ 시작 후 최대 1분이며, 시간이 지나면 AI를 자동 재호출하지 않고 FAILED로 확정한다. 인증 정보가 없으면 401(E1102)로\
