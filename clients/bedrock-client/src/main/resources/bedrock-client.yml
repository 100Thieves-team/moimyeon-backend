spring.config.activate.on-profile:
  - local-dev
  - dev
  - staging
  - live

spring:
  ai:
    model.chat: bedrock-converse
    retry:
      max-attempts: 1
    bedrock:
      aws:
        region: ${AWS_REGION:ap-northeast-2}
        # 최대 2회 생성이 45초 전체 예산 안에서 끝나도록 호출당 20초로 제한한다.
        timeout: 20s
        connection-timeout: 2s
        connection-acquisition-timeout: 2s
      converse.chat:
        # 이력서 개인정보를 서울 리전 안에서 처리하기 위해 In-Region direct model을 사용한다.
        model: ${AI_BEDROCK_MODEL:anthropic.claude-3-5-sonnet-20240620-v1:0}
        temperature: 0.1
        max-tokens: 300
