spring.ai.model.chat: none

---
spring.config.activate.on-profile:
  - local-dev
  - dev
  - staging
  - live

spring:
  ai:
    model.chat: bedrock-converse
    retry:
      max-attempts: 1
    bedrock:
      aws:
        region: ${AWS_REGION:ap-northeast-2}
        timeout: 30s
        connection-timeout: 2s
        connection-acquisition-timeout: 2s
      converse.chat:
        # Sonnet 5는 서울 In-Region을 지원하지 않아 서울 endpoint에서 Global profile을 호출한다.
        model: ${AI_BEDROCK_MODEL:global.anthropic.claude-sonnet-5}
        temperature: 0.1
        max-tokens: 300
