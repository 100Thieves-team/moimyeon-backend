spring.config.activate.on-profile:
  - local-dev
  - dev
  - staging
  - live

notification.email:
  ses:
    from-address: ${NOTIFICATION_EMAIL_SES_FROM_ADDRESS}
    region: ${AWS_REGION:ap-northeast-2}
    api-call-timeout: ${NOTIFICATION_EMAIL_SES_API_CALL_TIMEOUT:5s}
    api-call-attempt-timeout: ${NOTIFICATION_EMAIL_SES_API_CALL_ATTEMPT_TIMEOUT:3s}
  gmail:
    from-address: ${NOTIFICATION_EMAIL_GMAIL_ADDRESS}

spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${NOTIFICATION_EMAIL_GMAIL_ADDRESS}
  password: ${NOTIFICATION_EMAIL_GMAIL_APP_PASSWORD}
  properties:
    mail.smtp:
      auth: true
      starttls.enable: true
      connectiontimeout: 3000
      timeout: 5000
      writetimeout: 5000
