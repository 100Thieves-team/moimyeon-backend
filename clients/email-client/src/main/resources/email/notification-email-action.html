<!--
  이동 링크가 있을 때만 notification-email.html 의 action 자리에 끼운다.
  자리표시자 actionUrl 은 HTML 이스케이프해 채운다 (속성 안이므로 따옴표를 막아야 한다).
  버튼은 td 배경색 + a 패딩이다. Outlook 이 a 의 padding 을 무시한다.
-->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 0;border-collapse:separate;">
              <tr>
                <td align="center" bgcolor="#2563EB" style="background-color:#2563EB;border-radius:8px;">
                  <a href="{{actionUrl}}" style="display:inline-block;padding:14px 30px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,'Helvetica Neue',sans-serif;font-size:15px;font-weight:700;line-height:1;color:#FFFFFF;text-decoration:none;">자세히 보기</a>
                </td>
              </tr>
            </table>
            <p style="margin:20px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,'Helvetica Neue',sans-serif;font-size:13px;font-weight:400;line-height:1.6;color:#6B7280;">버튼이 눌리지 않으면 아래 주소를 열어 주세요.<br><a href="{{actionUrl}}" style="color:#2563EB;text-decoration:underline;word-break:break-all;">{{actionUrl}}</a></p>
