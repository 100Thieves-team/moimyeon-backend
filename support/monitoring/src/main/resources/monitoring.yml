management:
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 15s
        aggregation-temporality: cumulative
        base-time-unit: seconds
        connect-timeout: 1s
        read-timeout: 3s
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name:unknown-service}}
      service.instance.id: ${SERVICE_INSTANCE_ID:${HOSTNAME:${random.uuid}}}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:${spring.profiles.active:local}}
      service.version: ${APP_RELEASE:local}
  tracing:
    sampling:
      probability: 0.0
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s
    web:
      server:
        max-uri-tags: 100
  endpoints:
    web:
      exposure:
        # Public port exposes only ALB health probes. Add a separate protected
        # management port before enabling prometheus again.
        include: health
  endpoint:
    health:
      # ALB only needs UP/DOWN; do not leak internal details on the public port
      show-details: never
      show-components: never
      # also exposes /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
