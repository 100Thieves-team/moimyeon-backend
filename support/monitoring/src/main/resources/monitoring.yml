management:
  endpoints:
    web:
      exposure:
        # Public port exposes only ALB health probes. Add a separate protected
        # management port before enabling prometheus again.
        include: health
  endpoint:
    health:
      # ALB only needs UP/DOWN; do not leak internal details on the public port
      show-details: never
      show-components: never
      # also exposes /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
