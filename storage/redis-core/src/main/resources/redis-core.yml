spring:
  data:
    redis:
      url: ${STORAGE_REDIS_URL:redis://localhost:6379}
      connect-timeout: 1s
      timeout: 1s

storage.redis.notification:
  stream-key: ${STORAGE_REDIS_NOTIFICATION_STREAM_KEY:notification-events}
  consumer:
    group-name: ${STORAGE_REDIS_NOTIFICATION_CONSUMER_GROUP:notification-workers}
    consumer-name: ${STORAGE_REDIS_NOTIFICATION_CONSUMER_NAME:${HOSTNAME:core-worker-local}}
    batch-size: ${STORAGE_REDIS_NOTIFICATION_CONSUMER_BATCH_SIZE:10}
    pending-min-idle: ${STORAGE_REDIS_NOTIFICATION_PENDING_MIN_IDLE:30s}
  outbox-relay:
    lock-key: ${STORAGE_REDIS_NOTIFICATION_OUTBOX_RELAY_LOCK_KEY:notification-outbox-relay}
    lock-duration: ${STORAGE_REDIS_NOTIFICATION_OUTBOX_RELAY_LOCK_DURATION:2m}
