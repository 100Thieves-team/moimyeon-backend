spring:
  # test 프로파일은 local 설정을 그대로 상속한다(아래 test 문서가 데이터 로드만 오버라이드)
  profiles:
    group:
      test: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 100
  # 스키마 반영 주체는 환경마다 다르다.
  #   local·test(H2)  → schema.sql (아래 sql.init). Flyway 는 꺼 둔다.
  #   dev·staging·live → Flyway (db/migration/*.sql). 각 프로파일 문서에서 켠다.
  # Flyway 는 JPA EntityManagerFactory 보다 먼저 실행되므로, 마이그레이션이 끝난 스키마를
  # ddl-auto=validate 가 검증한다. 둘의 순서는 스프링 부트 자동설정이 보장한다.
  flyway:
    enabled: false
    locations: classpath:db/migration

---
spring.config.activate.on-profile: local

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  # local 은 인메모리 H2 전용이라 schema.sql(DROP+CREATE)을 부팅마다 실행해도 안전하다
  # (오히려 다중 테스트 컨텍스트 재초기화에 DROP 이 필요). 영속 DB(dev/live)엔 이 블록이 없고
  # ddl-auto=validate 로만 검증하므로 파괴적 초기화가 일어나지 않는다.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # seed.sql(참조 데이터)은 스키마의 일부로 취급 — 테스트 포함 항상 로드된다.
      # 로컬 개발용 테스트 데이터(data-local.sql)는 docker-compose initdb 전용이라 여기 없다.
      data-locations: classpath:seed.sql
  h2:
    console:
      enabled: true

storage:
  datasource:
    core:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:core;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      pool-name: core-db-pool
      data-source-properties:
        rewriteBatchedStatements: true

---
# 테스트 전용: local 을 상속하되 사람용 테스트 데이터(data-local.sql)는 싣지 않는다.
# 테스트는 시드(참조 데이터)만 전제하고, 그 외 데이터는 각 테스트가 스스로 만든다.
spring.config.activate.on-profile: test

spring:
  sql:
    init:
      data-locations: classpath:seed.sql

---
spring.config.activate.on-profile: local-dev

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true

storage:
  datasource:
    core:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${storage.database.core-db.url:localhost:3306/core}
      username: ${storage.database.core-db.username:moimyeon}
      password: ${storage.database.core-db.password:moimyeon}
      maximum-pool-size: 5
      connection-timeout: 1100
      keepalive-time: 30000
      validation-timeout: 1000
      max-lifetime: 600000
      pool-name: core-db-pool
      data-source-properties:
        socketTimeout: 3000
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

---
spring.config.activate.on-profile: dev

spring:
  flyway:
    enabled: true
    # dev DB 는 Flyway 도입 전에 손으로 만들어져 크롤링 데이터가 들어 있다(company·job_posting 등).
    # 비어 있지 않은 스키마에 이력 테이블이 없으면 Flyway 는 기본적으로 실패하는데,
    # baseline-on-migrate 가 그때 V1 을 "이미 적용됨"으로 도장만 찍고 V2 부터 실행하게 한다.
    # V1 이 곧 그 dev 스냅샷이라 도장을 찍는 것이 사실과 일치한다.
    # 이 옵션은 최초 1회를 위한 것이다 — 첫 마이그레이션이 성공하면 이력 테이블이 생기므로
    # 이후로는 아무 효과가 없다. 신규 환경(staging·live)에는 켜지 않는다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: dev snapshot before Flyway

storage:
  datasource:
    core:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${storage.database.core-db.url}
      username: ${storage.database.core-db.username}
      password: ${storage.database.core-db.password}
      maximum-pool-size: 5
      connection-timeout: 1100
      keepalive-time: 30000
      validation-timeout: 1000
      max-lifetime: 600000
      pool-name: core-db-pool
      data-source-properties:
        socketTimeout: 3000
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

---
spring.config.activate.on-profile: staging

spring:
  flyway:
    enabled: true

storage:
  datasource:
    core:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${storage.database.core-db.url}
      username: ${storage.database.core-db.username}
      password: ${storage.database.core-db.password}
      maximum-pool-size: 5
      connection-timeout: 1100
      keepalive-time: 30000
      validation-timeout: 1000
      max-lifetime: 600000
      pool-name: core-db-pool
      data-source-properties:
        socketTimeout: 3000
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

---
spring.config.activate.on-profile: live

spring:
  flyway:
    # live 는 빈 DB 에서 시작하므로 V1 부터 순서대로 실행된다.
    # baseline-on-migrate 를 켜지 않는 것이 중요하다 — 켜 두면 예상치 못하게 비어 있지 않은
    # 스키마를 만났을 때 V1 을 조용히 건너뛰어, 없는 테이블 위에서 V2 가 실패한다.
    enabled: true

storage:
  datasource:
    core:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${storage.database.core-db.url}
      username: ${storage.database.core-db.username}
      password: ${storage.database.core-db.password}
      maximum-pool-size: 25
      connection-timeout: 1100
      keepalive-time: 30000
      validation-timeout: 1000
      max-lifetime: 600000
      pool-name: core-db-pool
      data-source-properties:
        socketTimeout: 3000
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false