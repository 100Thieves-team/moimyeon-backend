name: Terraform Apply
run-name: Terraform Apply ${{ github.event.workflow_run.head_branch }}@${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ dev, main ]

permissions:
  contents: read

jobs:
  select:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_branch: ${{ github.event.workflow_run.head_branch }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
      terraform_required: ${{ steps.scope.outputs.terraform_required }}

    steps:
      - name: Pin CI-successful trigger revision
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Terraform boundary pinned to ${SOURCE_BRANCH}@${SOURCE_SHA}." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check out CI-successful trigger revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # MOI-565: compare with the last applied dev revision, not the first
      # parent, using the same paths as wait-for-terraform-boundary.sh. A
      # Terraform commit whose own run went stale is still pending here, so the
      # next app commit applies it. The variable snapshot can only lag, which
      # runs Terraform rather than skipping it.
      - name: Skip dev Terraform when infra is unchanged since the last apply
        id: scope
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          APPLIED_SHA: ${{ vars.MOIMYEON_TERRAFORM_APPLIED_SHA_DEV }}
        run: |
          set -euo pipefail
          required=true
          if [ "${SOURCE_BRANCH}" = dev ] \
            && [[ "${APPLIED_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            && git merge-base --is-ancestor "${APPLIED_SHA}" "${SOURCE_SHA}" 2>/dev/null \
            && git diff --quiet --no-renames "${APPLIED_SHA}" "${SOURCE_SHA}" -- \
              infra/terraform infra/observability ':(exclude)infra/terraform/tests' ':(exclude)infra/terraform/README.md' \
              ':(exclude)infra/observability/tests' ':(exclude)infra/observability/README.md'; then
            required=false
            echo "Terraform inputs are unchanged since applied dev revision ${APPLIED_SHA}; skipping Terraform." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "terraform_required=${required}" >> "$GITHUB_OUTPUT"

  plan-shared:
    needs: select
    if: ${{ vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && needs.select.outputs.source_branch == 'dev' && needs.select.outputs.terraform_required == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan-environment.yml
    with:
      environment: shared
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}

  apply-shared:
    needs: [ select, plan-shared ]
    if: ${{ vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && needs.plan-shared.result == 'success' && needs.plan-shared.outputs.current == 'true' && needs.plan-shared.outputs.apply_required == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply-environment.yml
    with:
      environment: shared
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}
      plan_prefix: ${{ needs.plan-shared.outputs.plan_prefix }}

  plan-dev:
    needs: [ select, plan-shared, apply-shared ]
    if: ${{ always() && vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && needs.select.result == 'success' && needs.plan-shared.result == 'success' && needs.plan-shared.outputs.current == 'true' && (needs.plan-shared.outputs.apply_required == 'false' || needs.apply-shared.result == 'success') }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan-environment.yml
    with:
      environment: dev
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}

  apply-dev:
    needs: [ select, plan-dev ]
    # shared no-op으로 생략된 apply-shared가 dev 적용까지 생략시키지 않게 한다.
    if: ${{ !cancelled() && vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && needs.select.result == 'success' && needs.plan-dev.result == 'success' && needs.plan-dev.outputs.current == 'true' && needs.plan-dev.outputs.apply_required == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply-environment.yml
    with:
      environment: dev
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}
      plan_prefix: ${{ needs.plan-dev.outputs.plan_prefix }}

  sync-dev-variables:
    needs: [ select, plan-dev, apply-dev ]
    if: ${{ always() && vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && needs.select.result == 'success' && needs.plan-dev.result == 'success' && needs.plan-dev.outputs.current == 'true' && (needs.plan-dev.outputs.apply_required == 'false' || needs.apply-dev.result == 'success') }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-sync-variables.yml
    with:
      environment: dev
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}

  # MOI-490: report the dev Terraform result. The deploy sees a failed apply
  # only as a Terraform boundary timeout, so the apply itself must report.
  # Routine non-results (infra unchanged, or a newer revision applies instead)
  # stay in the step summary. Live notifications belong to MOI-512.
  notify-dev:
    needs: [ select, plan-shared, apply-shared, plan-dev, apply-dev, sync-dev-variables ]
    if: ${{ always() && vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && needs.select.result == 'success' && needs.select.outputs.source_branch == 'dev' && needs.select.outputs.terraform_required == 'true' }}
    # A failure anywhere in this job (checkout, summary) must not fail the run.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out notifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          persist-credentials: false

      - name: Summarize the dev Terraform result
        id: result
        shell: bash
        env:
          PLAN_SHARED_RESULT: ${{ needs.plan-shared.result }}
          PLAN_SHARED_CURRENT: ${{ needs.plan-shared.outputs.current }}
          SHARED_APPLY_REQUIRED: ${{ needs.plan-shared.outputs.apply_required }}
          APPLY_SHARED_RESULT: ${{ needs.apply-shared.result }}
          APPLY_SHARED_CURRENT: ${{ needs.apply-shared.outputs.current }}
          PLAN_DEV_RESULT: ${{ needs.plan-dev.result }}
          PLAN_DEV_CURRENT: ${{ needs.plan-dev.outputs.current }}
          DEV_APPLY_REQUIRED: ${{ needs.plan-dev.outputs.apply_required }}
          APPLY_DEV_RESULT: ${{ needs.apply-dev.result }}
          APPLY_DEV_CURRENT: ${{ needs.apply-dev.outputs.current }}
          SYNC_DEV_RESULT: ${{ needs.sync-dev-variables.result }}
          SYNC_DEV_CURRENT: ${{ needs.sync-dev-variables.outputs.current }}
        run: bash infra/terraform/scripts/summarize-terraform-result.sh

      - name: Notify Slack
        if: steps.result.outputs.notify == 'true'
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_DEV }}
          DEPLOY_ENVIRONMENT: dev
          DEPLOY_KIND: terraform
          DEPLOY_OUTCOME: ${{ steps.result.outputs.outcome }}
          DEPLOY_SHA: ${{ needs.select.outputs.source_sha }}
          DEPLOY_ACTOR: ${{ github.event.workflow_run.actor.login }}
          DEPLOY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STAGE: ${{ steps.result.outputs.stage }}
          DEPLOY_REASON: ${{ steps.result.outputs.reason }}
          SHARED_RESULT: ${{ steps.result.outputs.shared }}
          DEV_RESULT: ${{ steps.result.outputs.dev }}
        run: bash infra/terraform/scripts/notify-deployment.sh

  plan-live:
    needs: select
    if: ${{ vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && vars.MOIMYEON_TERRAFORM_LIVE_CI_ENABLED == 'true' && needs.select.outputs.source_branch == 'main' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan-environment.yml
    with:
      environment: live
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}

  apply-live:
    needs: [ select, plan-live ]
    if: ${{ vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && vars.MOIMYEON_TERRAFORM_LIVE_CI_ENABLED == 'true' && needs.plan-live.result == 'success' && needs.plan-live.outputs.current == 'true' && needs.plan-live.outputs.apply_required == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply-environment.yml
    with:
      environment: live
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}
      plan_prefix: ${{ needs.plan-live.outputs.plan_prefix }}

  sync-live-variables:
    needs: [ select, plan-live, apply-live ]
    if: ${{ always() && vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && vars.MOIMYEON_TERRAFORM_LIVE_CI_ENABLED == 'true' && needs.select.result == 'success' && needs.plan-live.result == 'success' && needs.plan-live.outputs.current == 'true' && (needs.plan-live.outputs.apply_required == 'false' || needs.apply-live.result == 'success') }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-sync-variables.yml
    with:
      environment: live
      source_sha: ${{ needs.select.outputs.source_sha }}
      source_branch: ${{ needs.select.outputs.source_branch }}

  live-disabled:
    needs: select
    if: ${{ vars.MOIMYEON_TERRAFORM_CI_ENABLED == 'true' && vars.MOIMYEON_TERRAFORM_LIVE_CI_ENABLED != 'true' && needs.select.outputs.source_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Freeze live Terraform and promotion boundary
        run: |
          echo "::error::Live Terraform apply is disabled. Keep MOIMYEON_TERRAFORM_LIVE_CI_ENABLED=false until live infrastructure is explicitly authorized."
          exit 1

  disabled:
    needs: select
    if: ${{ vars.MOIMYEON_TERRAFORM_CI_ENABLED != 'true' && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report Terraform CI bootstrap gate
        run: |
          echo "::error::Terraform apply is disabled until the bootstrap preflight is complete. Application deployment remains frozen."
          exit 1
