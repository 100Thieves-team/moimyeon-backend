name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 같은 버전 번호를 가진 마이그레이션이 둘이면 Flyway 는 애플리케이션 부팅에서야 터진다.
      # 브랜치 두 개가 각자 같은 번호를 달고 나란히 머지되면 git 은 충돌 없이 통과시키므로
      # 배포까지 가서 드러난다. JDK 설치보다 먼저 걸러낸다.
      - name: Check migration versions
        run: |
          migrations="storage/db-core/src/main/resources/db/migration"
          duplicates="$(ls "${migrations}" | sed -n 's/^V\([0-9]\{1,\}\)__.*\.sql$/\1/p' | sort -n | uniq -d)"
          if [ -n "${duplicates}" ]; then
            for version in ${duplicates}; do
              offenders="$(ls "${migrations}" | grep "^V${version}__" | tr '\n' ' ')"
              echo "::error::마이그레이션 버전 ${version} 이 중복이다: ${offenders}"
            done
            exit 1
          fi

      # gradle.properties 의 javaVersion(toolchain)=25 와 일치시킨다.
      # settings.gradle.kts 에 toolchain 리졸버(foojay)가 없으므로 러너에 JDK 25 를 직접 설치해야 한다.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck

      # context 태그 테스트는 local 프로파일(인메모리 H2)로 ApplicationContext 를 띄우므로
      # DB 서비스 컨테이너는 필요 없고, 설정 placeholder 를 채울 더미 환경변수만 있으면 된다.
      - name: Test
        run: ./gradlew test
        env:
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          GOOGLE_OAUTH_CLIENT_ID: ci-dummy-client-id
          GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy-client-secret
