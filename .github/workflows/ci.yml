name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    # 앞 작업 브랜치를 base로 하는 스택 PR도 검증한다. edited는 base 변경을 포함한다.
    # title/body 편집도 edited다. 필수 체크 build·후보 이미지·하네스 게이트(시크릿 검사)는 계속 실행해
    # 화면과 배포 검증이 실제 결과만 보게 하고(build cache로 짧다), monitoring-smoke만 base가 바뀐 edited에서 돈다(MOI-593).
    types: [ opened, synchronize, reopened, edited, ready_for_review ]

permissions:
  contents: read

jobs:
  # 하네스 게이트 — 로컬 pre-commit(.agents/gates/)과 같은 스크립트를 호출한다.
  # 로컬 훅 미설치·우회를 잡는 백스톱 (DR-025).
  harness-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gate deps
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'

      - name: Skill lint
        run: python3 .agents/gates/lint_skills.py

      - name: PR file scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          python3 .agents/gates/check_pr_scope.py --base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}"

      # 검사 범위를 한 번만 계산해 아래 게이트들이 공유한다 — 스텝마다
      # 따로 계산하면 하나가 조용히 어긋난다(페어링이 마지막 커밋만 보던 결함).
      # 새 ref(before가 전부 0)면 비교 대상이 없다 — HEAD~1 로 때우면 여러
      # 커밋을 놓치고 root 커밋에선 아예 실패하므로, 그때는 전수 검사한다.
      - name: Compute gate scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ -n "${BASE_REF}" ]; then
            git fetch -q origin "${BASE_REF}"
            echo "GATE_RANGE=origin/${BASE_REF}...HEAD" >> "$GITHUB_ENV"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${zero}" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "GATE_RANGE=${BEFORE}...HEAD" >> "$GITHUB_ENV"
          else
            echo "::notice::새 ref이거나 before 커밋이 없다 — 추적 파일 전수 검사로 간다"
            echo "GATE_RANGE=" >> "$GITHUB_ENV"
          fi

      - name: Secret scan
        run: |
          if [ -n "${GATE_RANGE}" ]; then
            python3 .agents/gates/scan_secrets.py --range "${GATE_RANGE}"
          else
            git ls-files -z | xargs -0 python3 .agents/gates/scan_secrets.py --files
          fi

      - name: Gitleaks
        shell: bash
        run: |
          image="zricethezav/gitleaks@sha256:ebfeb6fd4f2c37fa371d3731ebfa662fdf80f93cd37d3b4771bb82263edff8d0"
          common=(
            --config=/repo/.gitleaks.toml
            --gitleaks-ignore-path=/repo/.gitleaksignore
            --no-banner
            --redact
            --verbose
          )
          if [ -n "${GATE_RANGE}" ]; then
            docker run --rm \
              --volume "${GITHUB_WORKSPACE}:/repo" \
              "${image}" \
              detect --source=/repo --log-opts="${GATE_RANGE}" "${common[@]}"
          else
            docker run --rm \
              --volume "${GITHUB_WORKSPACE}:/repo" \
              "${image}" \
              detect --source=/repo --log-opts=HEAD "${common[@]}"
          fi

      - name: Config profile sync
        run: python3 .agents/gates/check_config_profiles.py

      - name: Monitoring runtime contract
        run: python3 infra/observability/tests/test_contract.py

      # 정합성 페어링(WARN) — hooksPath 미설정 기여자에게도 경고가 닿게 한다.
      # 차단하지 않고 로그로만 노출한다(로컬 pre-commit과 동일 수위).
      - name: Pairing check
        shell: bash
        run: |
          # 공백·glob 문자가 든 경로가 깨지지 않게 NUL 구분으로 받아 배열로 넘긴다
          # (mapfile은 bash 4+ 전용이라 로컬 검증이 안 된다 — read 루프로 간다).
          files=()
          if [ -n "${GATE_RANGE}" ]; then
            while IFS= read -r -d '' f; do files+=("$f"); done \
              < <(git diff --name-only -z "${GATE_RANGE}")
          else
            while IFS= read -r -d '' f; do files+=("$f"); done < <(git ls-files -z)
          fi
          [ ${#files[@]} -eq 0 ] || python3 .agents/gates/check_pairings.py --worktree "${files[@]}"

      # 게이트 스크립트 자체의 회귀를 잡는다 (양성·음성 픽스처 + 실레포 오탐 0)
      - name: Gate self-test
        run: bash .agents/gates/tests/run.sh

      - name: API spec alert self-test
        run: |
          python3 .github/scripts/test_openapi_operation_diff.py
          python3 .github/scripts/test_notify_api_spec_change.py
          bash .github/scripts/api-spec-alert-contract.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 같은 버전 번호를 가진 마이그레이션이 둘이면 Flyway 는 애플리케이션 부팅에서야 터진다.
      # 브랜치 두 개가 각자 같은 번호를 달고 나란히 머지되면 git 은 충돌 없이 통과시키므로
      # 배포까지 가서 드러난다. JDK 설치보다 먼저 걸러낸다.
      - name: Check Flyway migration checker self-test
        run: python3 .github/scripts/test_check_flyway_migrations.py

      - name: Check Flyway migration contract
        run: python3 .github/scripts/check_flyway_migrations.py

      - name: Check ECS capacity ownership
        run: bash infra/terraform/tests/ecs-capacity-ownership.sh

      - name: Check deployment workflow contract
        run: bash infra/terraform/tests/deploy-workflow-contract.sh

      - name: Check release workflow contract
        run: bash infra/terraform/tests/release-workflow-contract.sh

      - name: Check Terraform configuration authority
        run: bash infra/terraform/tests/terraform-config-contract.sh

      - name: Check private monitoring infrastructure
        run: bash infra/terraform/tests/monitoring-infra-contract.sh

      - name: Check Terraform CI contract
        run: bash infra/terraform/tests/terraform-ci-contract.sh

      - name: Check Terraform bootstrap contract
        run: bash infra/terraform/tests/terraform-bootstrap-contract.sh

      - name: Check Terraform apply boundary waiter
        run: bash infra/terraform/tests/wait-for-terraform-apply-test.sh

      - name: Check deploy source verification and Terraform boundary
        run: bash infra/terraform/tests/deploy-source-verification-test.sh

      - name: Check deployment and Terraform notifications
        run: bash infra/terraform/tests/notify-deployment-test.sh

      - name: Check ECS stability wait deadline
        run: bash infra/terraform/tests/deploy-ecs-stable-wait-test.sh

      - name: Check live promotion task templates
        run: bash infra/terraform/tests/deploy-ecs-template-test.sh

      - name: Check source-bound deployment config and ECS requests
        run: python3 -m unittest discover -s infra/terraform/tests -p 'test_deploy_*.py' -v

      # gradle.properties 의 javaVersion(toolchain)=25 와 일치시킨다.
      # settings.gradle.kts 에 toolchain 리졸버(foojay)가 없으므로 러너에 JDK 25 를 직접 설치해야 한다.
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Lint
        run: ./gradlew ktlintCheck

      # context 태그 테스트는 local 프로파일(인메모리 H2)로 ApplicationContext 를 띄우므로
      # DB 서비스 컨테이너는 필요 없고, 설정 placeholder 를 채울 더미 환경변수만 있으면 된다.
      # storage:db-core의 MySqlSchemaValidationIT가 빈 MySQL 8.4에 V1부터 최신까지
      # Flyway migration을 적용하고 JPA 매핑까지 검증한다. 별도 DB job을 중복 실행하지 않는다.
      - name: Test (includes clean MySQL Flyway migration)
        run: ./gradlew test
        env:
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          GOOGLE_OAUTH_CLIENT_ID: ci-dummy-client-id
          GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy-client-secret

  # Documentation-only PRs are never deployed (DR-005), so they get no candidate.
  image-scope:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'dev' && github.actor != 'dependabot[bot]' && vars.MOIMYEON_PR_IMAGE_ROLE_TO_ASSUME_DEV != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      # The checkout is the PR merge commit; its first parent is the base tip.
      - name: Detect runtime changes
        id: scope
        shell: bash
        run: git diff --name-only --no-renames HEAD^1 HEAD | bash .github/scripts/runtime-changes.sh >> "$GITHUB_OUTPUT"

  # MOI-565: build the deploy images once, here, for the PR merge tree. With
  # strict up-to-date merges the dev merge commit has the same tree, so Deploy
  # AWS promotes these digests instead of rebuilding. Tags carry this run ID and
  # attempt, and the deploy trusts one only when this job succeeded in the same
  # run attempt as `build`: a tag pushed first elsewhere fails this immutable
  # push. Fork PRs get no OIDC token and the deploy builds. Not a required check.
  image:
    needs: image-scope
    if: ${{ needs.image-scope.outputs.runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # MOI-588: compile on the runner, whose Gradle cache survives between
      # runs (read-only on PRs; written by dev push CI). Docker only extracts
      # the layers and trains the AOT cache from the staged jars. Gradle runs
      # before the AWS credentials and the ECR login exist.
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build bootJars
        run: bash infra/terraform/scripts/build-image-jars.sh build/image-jars core-api core-worker

      - name: Resolve candidate image tags
        id: tags
        env:
          API_REPOSITORY: ${{ vars.MOIMYEON_PR_IMAGE_CANDIDATE_REPOSITORY_URL_DEV }}
          WORKER_REPOSITORY: ${{ vars.MOIMYEON_PR_IMAGE_WORKER_CANDIDATE_REPOSITORY_URL_DEV }}
        run: |
          set -euo pipefail
          tag="tree-$(git rev-parse 'HEAD^{tree}')-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "api=${API_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"
          echo "worker=${WORKER_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.MOIMYEON_PR_IMAGE_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ vars.MOIMYEON_AWS_REGION_DEV }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Keep the default provenance attestation: the image is then an index, and
      # copy-image-by-digest.sh preserves an index digest. A bare manifest was
      # re-wrapped into a new digest and failed promotion (MOI-565).
      # Each target keeps its own cache scope. mode=min is enough: every
      # intermediate stage is a cheap layer extraction, and the expensive AOT
      # training sits in the final stage (MOI-588).
      - name: Build and push Core API candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build/image-jars
          file: Dockerfile
          target: core-api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=deployment-images-core-api
          cache-to: type=gha,mode=min,scope=deployment-images-core-api

      - name: Build and push Worker candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build/image-jars
          file: Dockerfile
          target: core-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.worker }}
          cache-from: type=gha,scope=deployment-images-core-worker
          cache-to: type=gha,mode=min,scope=deployment-images-core-worker

  monitoring-smoke:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned monitoring containers and synthetic OTLP ingestion
        run: bash infra/observability/tests/smoke.sh
