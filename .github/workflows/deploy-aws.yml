name: Deploy AWS

# Pattern A (ECS on EC2) continuous deploy. Push to dev/main builds the Core API
# and, once its Terraform outputs are synced, the Notification Worker image.
# Each image gets its own ECR repository and ECS task-definition revision.
#
# Env is chosen by branch: dev -> dev environment, main -> live environment.
# Each environment assumes its own OIDC deploy role whose trust policy is pinned
# to the matching branch (infra/terraform/modules/moimyeon-environment/iam.tf).
# Repo variables come from `scripts/sync-github-variables.sh`.

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select environment
        id: env
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            dev)
              echo "name=dev" >> "$GITHUB_OUTPUT"
              echo "aws_region=${{ vars.MOIMYEON_AWS_REGION_DEV }}" >> "$GITHUB_OUTPUT"
              echo "role_arn=${{ vars.MOIMYEON_AWS_ROLE_TO_ASSUME_DEV }}" >> "$GITHUB_OUTPUT"
              echo "ecr_repository_url=${{ vars.MOIMYEON_ECR_REPOSITORY_URL_DEV }}" >> "$GITHUB_OUTPUT"
              echo "ecs_cluster=${{ vars.MOIMYEON_ECS_CLUSTER_DEV }}" >> "$GITHUB_OUTPUT"
              echo "ecs_service=${{ vars.MOIMYEON_ECS_SERVICE_DEV }}" >> "$GITHUB_OUTPUT"
              echo "ecs_container=${{ vars.MOIMYEON_ECS_CONTAINER_NAME_DEV }}" >> "$GITHUB_OUTPUT"
              echo "image_uri_parameter=${{ vars.MOIMYEON_IMAGE_URI_PARAMETER_DEV }}" >> "$GITHUB_OUTPUT"
              echo "worker_ecr_repository_url=${{ vars.MOIMYEON_WORKER_ECR_REPOSITORY_URL_DEV }}" >> "$GITHUB_OUTPUT"
              echo "worker_ecs_service=${{ vars.MOIMYEON_WORKER_ECS_SERVICE_DEV }}" >> "$GITHUB_OUTPUT"
              echo "worker_ecs_container=${{ vars.MOIMYEON_WORKER_ECS_CONTAINER_NAME_DEV }}" >> "$GITHUB_OUTPUT"
              echo "worker_image_uri_parameter=${{ vars.MOIMYEON_WORKER_IMAGE_URI_PARAMETER_DEV }}" >> "$GITHUB_OUTPUT"
              echo "ecs_health_check_grace_seconds=240" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "name=live" >> "$GITHUB_OUTPUT"
              echo "aws_region=${{ vars.MOIMYEON_AWS_REGION_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "role_arn=${{ vars.MOIMYEON_AWS_ROLE_TO_ASSUME_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "ecr_repository_url=${{ vars.MOIMYEON_ECR_REPOSITORY_URL_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "ecs_cluster=${{ vars.MOIMYEON_ECS_CLUSTER_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "ecs_service=${{ vars.MOIMYEON_ECS_SERVICE_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "ecs_container=${{ vars.MOIMYEON_ECS_CONTAINER_NAME_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "image_uri_parameter=${{ vars.MOIMYEON_IMAGE_URI_PARAMETER_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "worker_ecr_repository_url=${{ vars.MOIMYEON_WORKER_ECR_REPOSITORY_URL_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "worker_ecs_service=${{ vars.MOIMYEON_WORKER_ECS_SERVICE_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "worker_ecs_container=${{ vars.MOIMYEON_WORKER_ECS_CONTAINER_NAME_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "worker_image_uri_parameter=${{ vars.MOIMYEON_WORKER_IMAGE_URI_PARAMETER_LIVE }}" >> "$GITHUB_OUTPUT"
              echo "ecs_health_check_grace_seconds=240" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported branch ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Validate deployment variables
        id: deployment_config
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "${{ steps.env.outputs.aws_region }}"
            "${{ steps.env.outputs.role_arn }}"
            "${{ steps.env.outputs.ecr_repository_url }}"
            "${{ steps.env.outputs.ecs_cluster }}"
            "${{ steps.env.outputs.ecs_service }}"
            "${{ steps.env.outputs.ecs_container }}"
            "${{ steps.env.outputs.image_uri_parameter }}"
            "${{ steps.env.outputs.ecs_health_check_grace_seconds }}"
          )
          for value in "${required[@]}"; do
            if [ -z "$value" ]; then
              echo "::error::One or more MOIMYEON_* repository variables are missing for ${{ steps.env.outputs.name }}."
              echo "::error::Run infra/terraform/scripts/sync-github-variables.sh --env ${{ steps.env.outputs.name }} after terraform apply."
              exit 1
            fi
          done

          if [[ ! "${{ steps.env.outputs.ecs_health_check_grace_seconds }}" =~ ^[0-9]+$ ]]; then
            echo "::error::ecs_health_check_grace_seconds must be a positive integer."
            exit 1
          fi

          worker_values=(
            "${{ steps.env.outputs.worker_ecr_repository_url }}"
            "${{ steps.env.outputs.worker_ecs_service }}"
            "${{ steps.env.outputs.worker_ecs_container }}"
            "${{ steps.env.outputs.worker_image_uri_parameter }}"
          )
          configured_worker_values=0
          for value in "${worker_values[@]}"; do
            if [ -n "$value" ]; then
              configured_worker_values=$((configured_worker_values + 1))
            fi
          done

          if [ "${configured_worker_values}" -eq 0 ]; then
            echo "worker_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Notification Worker deployment is not configured yet; deploying Core API only."
          elif [ "${configured_worker_values}" -ne "${#worker_values[@]}" ]; then
            echo "::error::Notification Worker repository variables are only partially configured."
            echo "::error::Run infra/terraform/scripts/sync-github-variables.sh --env ${{ steps.env.outputs.name }} after terraform apply."
            exit 1
          else
            echo "worker_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.role_arn }}
          aws-region: ${{ steps.env.outputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ steps.env.outputs.ecr_repository_url }}"
          env_tag="${{ steps.env.outputs.name }}"
          sha_tag="${env_tag}-${GITHUB_SHA::12}"
          image_uri="${repo}:${sha_tag}"

          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image_uri}"
            echo "${repo}:${env_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Notification Worker image tags
        if: steps.deployment_config.outputs.worker_enabled == 'true'
        id: worker_image
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ steps.env.outputs.worker_ecr_repository_url }}"
          env_tag="${{ steps.env.outputs.name }}"
          sha_tag="${env_tag}-${GITHUB_SHA::12}"
          image_uri="${repo}:${sha_tag}"

          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "tags=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

      - name: Store deployed image URI in SSM
        shell: bash
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "${{ steps.env.outputs.image_uri_parameter }}" \
            --type String \
            --value "${{ steps.image.outputs.image_uri }}" \
            --overwrite

      - name: Register task definition revision
        id: task_def
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.ecs_service }}"
          container="${{ steps.env.outputs.ecs_container }}"
          image_uri="${{ steps.image.outputs.image_uri }}"

          current_task_def_arn="$(aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "${current_task_def_arn}" \
            --query taskDefinition \
            > task-definition.json

          # Swap only the container image; keep every other field (env, secrets,
          # roles, log config) that Terraform put in the definition. Drop the
          # read-only fields the register call rejects.
          jq \
            --arg container "${container}" \
            --arg image_uri "${image_uri}" '
            .containerDefinitions |= map(
              if .name == $container then .image = $image_uri else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-definition.json > task-definition-next.json

          next_task_def_arn="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "arn=${next_task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS service
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.ecs_service }}"
          task_definition="${{ steps.task_def.outputs.arn }}"
          grace_seconds="${{ steps.env.outputs.ecs_health_check_grace_seconds }}"
          deployment_config='{"minimumHealthyPercent":50,"maximumPercent":200,"deploymentCircuitBreaker":{"enable":true,"rollback":true}}'

          aws ecs update-service \
            --cluster "${cluster}" \
            --service "${service}" \
            --task-definition "${task_definition}" \
            --health-check-grace-period-seconds "${grace_seconds}" \
            --deployment-configuration "${deployment_config}" \
            --force-new-deployment \
            > service-update.json

          deadline=$((SECONDS + 1500))
          requested_deployment_seen="$(jq -r \
            --arg task_definition "${task_definition}" \
            'any(.service.deployments[]?; .taskDefinition == $task_definition)' \
            service-update.json)"
          while true; do
            aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${service}" \
              > service.json

            primary_task_definition="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' service.json)"
            primary_rollout_state="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' service.json)"
            requested_rollout_state="$(jq -r \
              --arg task_definition "${task_definition}" \
              '([.services[0].deployments[] | select(.taskDefinition == $task_definition) | (.rolloutState // "UNKNOWN")][0] // "MISSING")' \
              service.json)"
            deployment_count="$(jq -r '.services[0].deployments | length' service.json)"
            desired_count="$(jq -r '.services[0].desiredCount' service.json)"
            running_count="$(jq -r '.services[0].runningCount' service.json)"
            pending_count="$(jq -r '.services[0].pendingCount' service.json)"

            echo "ECS service ${service}: rollout=${primary_rollout_state}, deployments=${deployment_count}, running=${running_count}/${desired_count}, pending=${pending_count}"

            if [ "${requested_rollout_state}" != "MISSING" ]; then
              requested_deployment_seen=true
            fi

            if [ "${primary_rollout_state}" = "COMPLETED" ] \
              && [ "${primary_task_definition}" = "${task_definition}" ] \
              && [ "${deployment_count}" = "1" ] \
              && [ "${running_count}" = "${desired_count}" ] \
              && [ "${pending_count}" = "0" ]; then
              echo "ECS service ${service} is stable on ${task_definition}."
              break
            fi

            if [ "${requested_rollout_state}" = "FAILED" ]; then
              echo "::error::ECS deployment failed before the service became stable."
              jq '.services[0].events[0:10]' service.json
              exit 1
            fi

            if [ "${requested_deployment_seen}" = "true" ] \
              && [ "${requested_rollout_state}" = "MISSING" ] \
              && [ "${primary_task_definition}" != "${task_definition}" ]; then
              echo "::error::ECS rolled back from ${task_definition} to ${primary_task_definition}."
              jq '.services[0].events[0:10]' service.json
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for ECS service ${service} to stabilize."
              jq '.services[0].deployments' service.json
              jq '.services[0].events[0:10]' service.json
              exit 1
            fi

            sleep 15
          done

      # Keep the Worker chain after Core API is stable. A Worker build or rollout
      # failure must not prevent an otherwise valid API revision from deploying.
      - name: Build and push Notification Worker image
        if: steps.deployment_config.outputs.worker_enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker_image.outputs.tags }}
          build-args: |
            GRADLE_BOOT_JAR_TASK=:core:core-worker:bootJar
            BOOT_JAR_DIRECTORY=core/core-worker
          cache-from: type=gha,scope=core-worker
          cache-to: type=gha,mode=max,scope=core-worker

      - name: Store Notification Worker image URI in SSM
        if: steps.deployment_config.outputs.worker_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "${{ steps.env.outputs.worker_image_uri_parameter }}" \
            --type String \
            --value "${{ steps.worker_image.outputs.image_uri }}" \
            --overwrite

      - name: Register Notification Worker task definition revision
        if: steps.deployment_config.outputs.worker_enabled == 'true'
        id: worker_task_def
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.worker_ecs_service }}"
          container="${{ steps.env.outputs.worker_ecs_container }}"
          image_uri="${{ steps.worker_image.outputs.image_uri }}"

          current_task_def_arn="$(aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "${current_task_def_arn}" \
            --query taskDefinition \
            > worker-task-definition.json

          if ! jq -e \
            --arg container "${container}" \
            '.containerDefinitions | any(.name == $container)' \
            worker-task-definition.json > /dev/null; then
            echo "::error::Container ${container} is absent from Notification Worker task definition."
            exit 1
          fi

          jq \
            --arg container "${container}" \
            --arg image_uri "${image_uri}" '
            .containerDefinitions |= map(
              if .name == $container then .image = $image_uri else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' worker-task-definition.json > worker-task-definition-next.json

          next_task_def_arn="$(aws ecs register-task-definition \
            --cli-input-json file://worker-task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "arn=${next_task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Deploy Notification Worker ECS service
        if: steps.deployment_config.outputs.worker_enabled == 'true'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.worker_ecs_service }}"
          task_definition="${{ steps.worker_task_def.outputs.arn }}"
          deployment_config='{"minimumHealthyPercent":0,"maximumPercent":200,"deploymentCircuitBreaker":{"enable":true,"rollback":true}}'

          aws ecs update-service \
            --cluster "${cluster}" \
            --service "${service}" \
            --task-definition "${task_definition}" \
            --deployment-configuration "${deployment_config}" \
            --force-new-deployment \
            > worker-service-update.json

          desired_count="$(jq -r '.service.desiredCount' worker-service-update.json)"
          if [ "${desired_count}" = "0" ]; then
            echo "Notification Worker desired count is 0; task definition ${task_definition} is staged without starting a task."
            exit 0
          fi

          deadline=$((SECONDS + 1500))
          requested_deployment_seen="$(jq -r \
            --arg task_definition "${task_definition}" \
            'any(.service.deployments[]?; .taskDefinition == $task_definition)' \
            worker-service-update.json)"
          while true; do
            aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${service}" \
              > worker-service.json

            primary_task_definition="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' worker-service.json)"
            primary_rollout_state="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' worker-service.json)"
            requested_rollout_state="$(jq -r \
              --arg task_definition "${task_definition}" \
              '([.services[0].deployments[] | select(.taskDefinition == $task_definition) | (.rolloutState // "UNKNOWN")][0] // "MISSING")' \
              worker-service.json)"
            deployment_count="$(jq -r '.services[0].deployments | length' worker-service.json)"
            running_count="$(jq -r '.services[0].runningCount' worker-service.json)"
            pending_count="$(jq -r '.services[0].pendingCount' worker-service.json)"

            echo "Notification Worker ${service}: rollout=${primary_rollout_state}, deployments=${deployment_count}, running=${running_count}/${desired_count}, pending=${pending_count}"

            if [ "${requested_rollout_state}" != "MISSING" ]; then
              requested_deployment_seen=true
            fi

            if [ "${primary_rollout_state}" = "COMPLETED" ] \
              && [ "${primary_task_definition}" = "${task_definition}" ] \
              && [ "${deployment_count}" = "1" ] \
              && [ "${running_count}" = "${desired_count}" ] \
              && [ "${pending_count}" = "0" ]; then
              echo "Notification Worker ${service} is stable on ${task_definition}."
              break
            fi

            if [ "${requested_rollout_state}" = "FAILED" ]; then
              echo "::error::Notification Worker deployment failed before the service became stable."
              jq '.services[0].events[0:10]' worker-service.json
              exit 1
            fi

            if [ "${requested_deployment_seen}" = "true" ] \
              && [ "${requested_rollout_state}" = "MISSING" ] \
              && [ "${primary_task_definition}" != "${task_definition}" ]; then
              echo "::error::Notification Worker rolled back from ${task_definition} to ${primary_task_definition}."
              jq '.services[0].events[0:10]' worker-service.json
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for Notification Worker ${service} to stabilize."
              jq '.services[0].deployments' worker-service.json
              jq '.services[0].events[0:10]' worker-service.json
              exit 1
            fi

            sleep 15
          done

      - name: Print ECS diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.ecs_service }}"

          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            > service.json

          echo "Recent ECS deployments:"
          jq '.services[0].deployments' service.json

          echo "Recent ECS events:"
          jq '.services[0].events[0:20]' service.json

          target_group_arn="$(jq -r '.services[0].loadBalancers[0].targetGroupArn // empty' service.json)"
          if [ -n "${target_group_arn}" ]; then
            echo "Target health:"
            if ! aws elbv2 describe-target-health \
              --target-group-arn "${target_group_arn}" \
              --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
              --output json; then
              echo "::warning::Target health diagnostics failed; continuing with stopped task diagnostics."
            fi
          fi

          task_arns="$(aws ecs list-tasks \
            --cluster "${cluster}" \
            --service-name "${service}" \
            --desired-status STOPPED \
            --max-items 5 \
            --query 'taskArns' \
            --output text)"
          if [ -n "${task_arns}" ] && [ "${task_arns}" != "None" ]; then
            echo "Recent stopped tasks:"
            aws ecs describe-tasks \
              --cluster "${cluster}" \
              --tasks ${task_arns} \
              --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,stoppedReason:stoppedReason,stoppedAt:stoppedAt,containers:containers[].{name:name,exitCode:exitCode,reason:reason,lastStatus:lastStatus,healthStatus:healthStatus}}' \
              --output json
          fi

      - name: Print Notification Worker ECS diagnostics
        if: failure() && steps.deployment_config.outputs.worker_enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.worker_ecs_service }}"

          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            > worker-service.json

          echo "Recent Notification Worker deployments:"
          jq '.services[0].deployments' worker-service.json

          echo "Recent Notification Worker events:"
          jq '.services[0].events[0:20]' worker-service.json

          task_arns="$(aws ecs list-tasks \
            --cluster "${cluster}" \
            --service-name "${service}" \
            --desired-status STOPPED \
            --max-items 5 \
            --query 'taskArns' \
            --output text)"
          if [ -n "${task_arns}" ] && [ "${task_arns}" != "None" ]; then
            echo "Recent stopped Notification Worker tasks:"
            aws ecs describe-tasks \
              --cluster "${cluster}" \
              --tasks ${task_arns} \
              --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,stoppedReason:stoppedReason,stoppedAt:stoppedAt,containers:containers[].{name:name,exitCode:exitCode,reason:reason,lastStatus:lastStatus,healthStatus:healthStatus}}' \
              --output json
          fi
