name: Deploy AWS

# Pattern A (ECS on EC2) continuous deploy, started by the dev push itself
# (MOI-565). The dev ruleset requires a PR, the `build` check, and an
# up-to-date branch, so the merge commit's tree is exactly the tree PR CI
# verified. The deploy proves that before using AWS credentials instead of
# waiting for a second CI run, then promotes the image PR CI already built for
# that tree (falling back to a build only when no candidate exists). It waits
# for Terraform only when an unapplied infra/terraform change precedes it.
#
# Each image gets its own ECR repository and ECS task-definition revision.
# Live is intentionally absent: main merges promote dev-verified digests.

on:
  push:
    branches: [ dev ]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_required: ${{ steps.changes.outputs.deploy_required }}

    steps:
      - name: Check out pushed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect deployable changes
        id: changes
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base_sha="$(git rev-parse "${DEPLOY_SHA}^" 2>/dev/null || true)"
          if [ -z "${base_sha}" ]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # MOI-592: one rule for what can change a running environment.
          runtime="$(git diff --name-only --no-renames "${base_sha}" "${DEPLOY_SHA}" \
            | bash .github/scripts/runtime-changes.sh dev)"
          echo "deploy_required=${runtime#runtime=}" >> "$GITHUB_OUTPUT"

  # Runs outside the deploy lock: Terraform Apply and its variable sync take the
  # same deploy-aws-dev lock, so waiting for them while holding it would block
  # the very apply this deploy needs.
  prepare:
    needs: changes
    if: ${{ needs.changes.outputs.deploy_required == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    outputs:
      tree: ${{ steps.source.outputs.tree }}
      candidate_tag: ${{ steps.source.outputs.candidate_tag }}
      candidate_not_before: ${{ steps.source.outputs.candidate_not_before }}
      failure_stage: ${{ steps.failure.outputs.stage }}
      failure_reason: ${{ steps.failure.outputs.reason }}

    steps:
      - name: Check out pushed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR CI checked this exact tree
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result="$(bash infra/terraform/scripts/verify-pr-ci.sh "${DEPLOY_SHA}" dev)"
          tree="$(sed -n 's/^tree=//p' <<< "${result}")"
          candidate_tag="$(sed -n 's/^candidate_tag=//p' <<< "${result}")"
          candidate_not_before="$(sed -n 's/^candidate_not_before=//p' <<< "${result}")"
          [[ "${tree}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ ! "${candidate_tag}" =~ ^tree-[0-9a-f]{40}-run-[0-9]+-[0-9]+$ ]] \
            || [[ ! "${candidate_not_before}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]]; then
            candidate_tag=""
            candidate_not_before=""
          fi
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=${candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "candidate_not_before=${candidate_not_before}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.MOIMYEON_AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ vars.MOIMYEON_AWS_REGION_DEV }}

      - name: Wait for the Terraform boundary
        id: boundary
        shell: bash
        env:
          APPLIED_SHA_PARAMETER: ${{ vars.MOIMYEON_TERRAFORM_APPLIED_SHA_PARAMETER_DEV }}
        run: |
          set -euo pipefail
          bash infra/terraform/scripts/wait-for-terraform-boundary.sh \
            "${DEPLOY_SHA}" "${APPLIED_SHA_PARAMETER}"

      # MOI-490: tell the two preparation failures apart in the notification.
      - name: Record the preparation failure stage
        id: failure
        if: failure() || cancelled()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          if [ "${SOURCE_OUTCOME}" = failure ] || [ "${SOURCE_OUTCOME}" = cancelled ]; then
            stage="PR CI verification"
            reason="No verified PR CI run for this tree (no merged PR, failed build check, or GitHub API error); see the run log"
          elif [ "${BOUNDARY_OUTCOME}" = failure ] || [ "${BOUNDARY_OUTCOME}" = cancelled ]; then
            stage="Terraform boundary"
            reason="An earlier infra/terraform change was not applied in time; check the Terraform Apply run"
          else
            stage="Preparation"
            reason="Deploy preparation failed before the Terraform boundary"
          fi
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

  # The deploy job's own Slack step never runs when prepare fails or is
  # cancelled (unverified revision, Terraform boundary timeout), so report it here.
  prepare-failed:
    needs: [ changes, prepare ]
    if: ${{ always() && needs.changes.outputs.deploy_required == 'true' && (needs.prepare.result == 'failure' || needs.prepare.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out notifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Notify Slack
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_DEV }}
          DEPLOY_ENVIRONMENT: dev
          DEPLOY_KIND: deployment
          DEPLOY_OUTCOME: ${{ needs.prepare.result }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STAGE: ${{ needs.prepare.outputs.failure_stage || 'Preparation' }}
          DEPLOY_REASON: ${{ needs.prepare.result == 'cancelled' && 'Deploy preparation was cancelled before deploy' || needs.prepare.outputs.failure_reason || 'Deploy preparation failed before deploy' }}
          API_RESULT: skipped
          WORKER_RESULT: skipped
        run: bash infra/terraform/scripts/notify-deployment.sh

  deploy:
    needs: [ changes, prepare ]
    if: ${{ needs.changes.outputs.deploy_required == 'true' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-aws-dev
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Check out pushed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # Runs after the mutation lock: a queued older revision must not replace a
      # newer one. Successors without runtime changes do not supersede it.
      - name: Skip when a newer runtime revision is on dev
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev"
          latest_sha="$(git rev-parse refs/remotes/origin/dev)"
          current=true
          if [ "${latest_sha}" != "${DEPLOY_SHA}" ]; then
            if ! git merge-base --is-ancestor "${DEPLOY_SHA}" "${latest_sha}"; then
              echo "::error::${DEPLOY_SHA} is not on the current dev history."
              exit 1
            fi
            runtime="$(git diff --name-only --no-renames "${DEPLOY_SHA}" "${latest_sha}" \
              | bash .github/scripts/runtime-changes.sh dev)"
            if [ "${runtime}" = runtime=true ]; then
              current=false
            fi
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest_sha=${latest_sha}" >> "$GITHUB_OUTPUT"
          if [ "${current}" = false ]; then
            echo "Skipping ${DEPLOY_SHA}: newer runtime revision ${latest_sha} deploys instead." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure AWS credentials
        if: steps.freshness.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.MOIMYEON_AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ vars.MOIMYEON_AWS_REGION_DEV }}

      # The boundary only moves forward; confirm it once without waiting.
      - name: Confirm the Terraform boundary under the deploy lock
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          APPLIED_SHA_PARAMETER: ${{ vars.MOIMYEON_TERRAFORM_APPLIED_SHA_PARAMETER_DEV }}
          TERRAFORM_BOUNDARY_WAIT_SECONDS: "1"
          TERRAFORM_BOUNDARY_POLL_SECONDS: "1"
        run: |
          set -euo pipefail
          bash infra/terraform/scripts/wait-for-terraform-boundary.sh \
            "${DEPLOY_SHA}" "${APPLIED_SHA_PARAMETER}"

      # Read after the boundary so task templates match the applied Terraform.
      - name: Load Terraform deployment config
        id: env
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          CONFIG_PARAMETER: ${{ vars.MOIMYEON_DEPLOY_CONFIG_PARAMETER_DEV }}
          ROLE_ARN: ${{ vars.MOIMYEON_AWS_ROLE_TO_ASSUME_DEV }}
        run: |
          set -euo pipefail
          aws ssm get-parameter \
            --name "${CONFIG_PARAMETER}" \
            --query 'Parameter.Value' \
            --output text > "${RUNNER_TEMP}/dev-deploy-config.json"
          python3 infra/terraform/scripts/deploy_config.py read \
            --file "${RUNNER_TEMP}/dev-deploy-config.json" --role-arn "${ROLE_ARN}"

      - name: Validate deployment variables
        id: deployment_config
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          DEPLOYMENT_LEDGER_ENABLED: ${{ vars.MOIMYEON_DEPLOYMENT_LEDGER_ENABLED }}
        run: |
          set -euo pipefail
          required=(
            "${{ steps.env.outputs.aws_region }}"
            "${{ steps.env.outputs.role_arn }}"
            "${{ steps.env.outputs.ecr_repository_url }}"
            "${{ steps.env.outputs.ecs_cluster }}"
            "${{ steps.env.outputs.ecs_service }}"
            "${{ steps.env.outputs.ecs_container }}"
            "${{ steps.env.outputs.ecs_task_definition }}"
            "${{ steps.env.outputs.image_uri_parameter }}"
            "${{ steps.env.outputs.app_url }}"
            "${{ steps.env.outputs.ecs_health_check_grace_seconds }}"
          )
          for value in "${required[@]}"; do
            if [ -z "$value" ]; then
              echo "::error::One or more Terraform deployment config fields are missing for ${{ steps.env.outputs.name }}."
              echo "::error::Re-run the Terraform Apply workflow to republish the deploy config."
              exit 1
            fi
          done

          if [[ ! "${{ steps.env.outputs.ecs_health_check_grace_seconds }}" =~ ^[0-9]+$ ]]; then
            echo "::error::ecs_health_check_grace_seconds must be a positive integer."
            exit 1
          fi

          if [ "${DEPLOYMENT_LEDGER_ENABLED}" = "true" ]; then
            if [ -z "${{ steps.env.outputs.bundle_parameter_prefix }}" ]; then
              echo "::error::Deployment ledger is enabled but its SSM prefix is missing."
              exit 1
            fi
            echo "ledger_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "ledger_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          worker_values=(
            "${{ steps.env.outputs.worker_ecr_repository_url }}"
            "${{ steps.env.outputs.worker_ecs_service }}"
            "${{ steps.env.outputs.worker_ecs_container }}"
            "${{ steps.env.outputs.worker_ecs_task_definition }}"
            "${{ steps.env.outputs.worker_image_uri_parameter }}"
          )
          configured_worker_values=0
          for value in "${worker_values[@]}"; do
            if [ -n "$value" ]; then
              configured_worker_values=$((configured_worker_values + 1))
            fi
          done

          if [ "${configured_worker_values}" -eq 0 ]; then
            echo "worker_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Notification Worker deployment is not configured yet; deploying Core API only."
          elif [ "${configured_worker_values}" -ne "${#worker_values[@]}" ]; then
            echo "::error::Notification Worker Terraform deployment config is only partially configured."
            echo "::error::Re-run the Terraform Apply workflow to republish the deploy config."
            exit 1
          else
            echo "worker_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # MOI-589: a retry of an already recorded commit redeploys exactly the
      # recorded task definitions. New registrations would conflict with the
      # immutable bundle that live promotion and rollback read.
      - name: Find an already recorded deployment bundle
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.ledger_enabled == 'true'
        id: recorded
        shell: bash
        env:
          BUNDLE_PARAMETER_PREFIX: ${{ steps.env.outputs.bundle_parameter_prefix }}
          WORKER_ENABLED: ${{ steps.deployment_config.outputs.worker_enabled }}
        run: |
          set -euo pipefail
          result="$(bash infra/terraform/scripts/find-deployment-bundle.sh \
            "${BUNDLE_PARAMETER_PREFIX}" dev "${DEPLOY_SHA}")"
          # The bundle cannot change, so a Worker toggle since it was recorded
          # must stop here, before any image or service changes.
          if grep -qx 'recorded=true' <<< "${result}"; then
            if grep -qx 'worker_task_definition_arn=' <<< "${result}"; then
              if [ "${WORKER_ENABLED}" = "true" ]; then
                echo "::error::The recorded bundle for this commit has no Notification Worker, but the Worker is now enabled. Deploy a new commit."
                exit 1
              fi
            elif [ "${WORKER_ENABLED}" != "true" ]; then
              echo "::error::The recorded bundle for this commit includes a Notification Worker, but the Worker is now disabled. Deploy a new commit."
              exit 1
            fi
          fi
          echo "${result}" >> "$GITHUB_OUTPUT"
          if grep -qx 'recorded=true' <<< "${result}"; then
            echo "Deployment bundle for ${DEPLOY_SHA::12} already recorded; redeploying its task definitions." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate both Terraform task templates before image build
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          API_TEMPLATE: ${{ steps.env.outputs.ecs_task_definition }}
          API_CONTAINER: ${{ steps.env.outputs.ecs_container }}
          WORKER_TEMPLATE: ${{ steps.env.outputs.worker_ecs_task_definition }}
          WORKER_CONTAINER: ${{ steps.env.outputs.worker_ecs_container }}
          WORKER_ENABLED: ${{ steps.deployment_config.outputs.worker_enabled }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "${API_TEMPLATE}" \
            --query taskDefinition > "${RUNNER_TEMP}/task-definition.json"
          python3 infra/terraform/scripts/prepare_ecs_task.py \
            --file "${RUNNER_TEMP}/task-definition.json" --expected-arn "${API_TEMPLATE}" \
            --container "${API_CONTAINER}" --validate-only
          if [ "${WORKER_ENABLED}" = true ]; then
            aws ecs describe-task-definition --task-definition "${WORKER_TEMPLATE}" \
              --query taskDefinition > "${RUNNER_TEMP}/worker-task-definition.json"
            python3 infra/terraform/scripts/prepare_ecs_task.py \
              --file "${RUNNER_TEMP}/worker-task-definition.json" --expected-arn "${WORKER_TEMPLATE}" \
              --container "${WORKER_CONTAINER}" --validate-only
          fi

      - name: Login to Amazon ECR
        if: steps.freshness.outputs.current == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve image tags
        if: steps.freshness.outputs.current == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ steps.env.outputs.ecr_repository_url }}"
          env_tag="${{ steps.env.outputs.name }}"
          sha_tag="${env_tag}-${DEPLOY_SHA::12}"
          image_uri="${repo}:${sha_tag}"

          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "tags=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Resolve Notification Worker image tags
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.worker_enabled == 'true'
        id: worker_image
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ steps.env.outputs.worker_ecr_repository_url }}"
          env_tag="${{ steps.env.outputs.name }}"
          sha_tag="${env_tag}-${DEPLOY_SHA::12}"
          image_uri="${repo}:${sha_tag}"

          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "tags=${image_uri}" >> "$GITHUB_OUTPUT"

      # MOI-589: before any service changes, a recorded retry must still point
      # at this run's images (repository or container renames would split them).
      - name: Verify recorded task definitions match this run
        if: steps.freshness.outputs.current == 'true' && steps.recorded.outputs.recorded == 'true'
        shell: bash
        env:
          API_TASK_DEFINITION: ${{ steps.recorded.outputs.api_task_definition_arn }}
          API_CONTAINER: ${{ steps.env.outputs.ecs_container }}
          API_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          WORKER_TASK_DEFINITION: ${{ steps.recorded.outputs.worker_task_definition_arn }}
          WORKER_CONTAINER: ${{ steps.env.outputs.worker_ecs_container }}
          WORKER_IMAGE_URI: ${{ steps.worker_image.outputs.image_uri }}
        run: |
          set -euo pipefail
          check() {
            local task_definition="$1" container="$2" expected="$3" recorded
            recorded="$(aws ecs describe-task-definition --task-definition "${task_definition}" \
              --query "taskDefinition.containerDefinitions[?name=='${container}'].image | [0]" --output text)"
            if [ "${recorded}" != "${expected}" ]; then
              echo "::error::Recorded task definition runs ${recorded}, not this run's ${expected}."
              exit 1
            fi
          }
          check "${API_TASK_DEFINITION}" "${API_CONTAINER}" "${API_IMAGE_URI}"
          if [ -n "${WORKER_TASK_DEFINITION}" ]; then
            check "${WORKER_TASK_DEFINITION}" "${WORKER_CONTAINER}" "${WORKER_IMAGE_URI}"
          fi

      - name: Set up Docker Buildx
        if: steps.freshness.outputs.current == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The verified CI run pushed both targets for this tree. Copy the exact
      # digests into the deploy repositories; the build steps below only run as
      # a fallback (no trusted candidate: fork PR, failed or missing image job).
      - name: Promote PR-built candidate images
        id: candidate
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          CANDIDATE_NOT_BEFORE: ${{ needs.prepare.outputs.candidate_not_before }}
          API_CANDIDATE_REPOSITORY: ${{ steps.env.outputs.candidate_repository_url }}
          WORKER_CANDIDATE_REPOSITORY: ${{ steps.env.outputs.worker_candidate_repository_url }}
          API_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          WORKER_IMAGE_URI: ${{ steps.worker_image.outputs.image_uri }}
          WORKER_ENABLED: ${{ steps.deployment_config.outputs.worker_enabled }}
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_TAG}" ]; then
            echo "No trusted PR-built candidate; the images will be built here."
            echo "api=none" >> "$GITHUB_OUTPUT"
            echo "worker=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${CANDIDATE_TAG}" =~ ^tree-[0-9a-f]{40}-run-[0-9]+-[0-9]+$ ]] || exit 1

          # Candidates expire 14 days after push, and an expired tag name can be
          # pushed again by another workflow. Trust only runs younger than that.
          # (Push time cannot be used: an identical rebuild keeps the first push
          # time, because Spring Boot jars and the image layers are reproducible.)
          if [ $(( $(date -u +%s) - $(date -u -d "${CANDIDATE_NOT_BEFORE}" +%s) )) -gt $(( 13 * 24 * 3600 )) ]; then
            echo "Candidate CI run started over 13 days ago; the images will be built here."
            echo "api=expired" >> "$GITHUB_OUTPUT"
            echo "worker=expired" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          promote() {
            local candidate="$1"
            local target="$2"
            local output="$3"
            # A retry after an earlier build or promotion keeps that image.
            if docker buildx imagetools inspect "${target}" >/dev/null 2>&1; then
              echo "Deploy image ${target} already exists; keeping it."
              echo "${output}=existing" >> "$GITHUB_OUTPUT"
              return 0
            fi
            if ! docker buildx imagetools inspect "${candidate}" >/dev/null 2>&1; then
              echo "Candidate ${candidate} is missing; the image will be built here."
              echo "${output}=missing" >> "$GITHUB_OUTPUT"
              return 0
            fi
            bash infra/terraform/scripts/copy-image-by-digest.sh "${candidate}" "${target}" >/dev/null
            echo "Promoted PR-built candidate ${candidate} to ${target}."
            echo "${output}=promoted" >> "$GITHUB_OUTPUT"
          }

          promote "${API_CANDIDATE_REPOSITORY}:${CANDIDATE_TAG}" "${API_IMAGE_URI}" api
          if [ "${WORKER_ENABLED}" = "true" ]; then
            promote "${WORKER_CANDIDATE_REPOSITORY}:${CANDIDATE_TAG}" "${WORKER_IMAGE_URI}" worker
          fi

      - name: Check for existing Core API image
        if: steps.freshness.outputs.current == 'true'
        id: api_image_cache
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.image_uri }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing immutable Core API image."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Fallback builds compile on this runner like PR CI (MOI-588). Only the
      # images that still have to be built get a bootJar. "Deploy ECS service"
      # builds the Worker image from this decision instead of looking again.
      - name: Decide fallback bootJars
        if: steps.freshness.outputs.current == 'true'
        id: fallback_jars
        shell: bash
        env:
          API_IMAGE_EXISTS: ${{ steps.api_image_cache.outputs.exists }}
          WORKER_ENABLED: ${{ steps.deployment_config.outputs.worker_enabled }}
          WORKER_IMAGE_TAG: ${{ steps.worker_image.outputs.tags }}
        run: |
          set -euo pipefail
          modules=""
          if [ "${API_IMAGE_EXISTS}" != "true" ]; then
            modules="core-api"
          fi
          if [ "${WORKER_ENABLED}" = "true" ] \
            && ! docker buildx imagetools inspect "${WORKER_IMAGE_TAG}" >/dev/null 2>&1; then
            modules="${modules:+${modules} }core-worker"
          fi
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.freshness.outputs.current == 'true' && steps.fallback_jars.outputs.modules != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.freshness.outputs.current == 'true' && steps.fallback_jars.outputs.modules != ''
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Build fallback bootJars
        if: steps.freshness.outputs.current == 'true' && steps.fallback_jars.outputs.modules != ''
        shell: bash
        env:
          JAR_MODULES: ${{ steps.fallback_jars.outputs.modules }}
        run: |
          set -euo pipefail
          read -r -a modules <<< "${JAR_MODULES}"
          bash infra/terraform/scripts/build-image-jars.sh build/image-jars "${modules[@]}"

      - name: Build and push image
        id: api_build
        if: steps.freshness.outputs.current == 'true' && steps.api_image_cache.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build/image-jars
          file: Dockerfile
          target: core-api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=deployment-images-core-api
          cache-to: type=gha,mode=min,scope=deployment-images-core-api

      - name: Register task definition revision
        if: steps.freshness.outputs.current == 'true'
        id: task_def
        shell: bash
        env:
          RECORDED_TASK_DEFINITION_ARN: ${{ steps.recorded.outputs.api_task_definition_arn }}
        run: |
          set -euo pipefail

          container="${{ steps.env.outputs.ecs_container }}"
          template_task_def_arn="${{ steps.env.outputs.ecs_task_definition }}"
          image_uri="${{ steps.image.outputs.image_uri }}"

          # "Verify recorded task definitions match this run" checked the image.
          if [ -n "${RECORDED_TASK_DEFINITION_ARN}" ]; then
            echo "Reusing recorded Core API task definition ${RECORDED_TASK_DEFINITION_ARN}."
            echo "arn=${RECORDED_TASK_DEFINITION_ARN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 infra/terraform/scripts/prepare_ecs_task.py \
            --file "${RUNNER_TEMP}/task-definition.json" --expected-arn "${template_task_def_arn}" \
            --container "${container}" --image "${image_uri}" --release "${DEPLOY_SHA}" \
            > "${RUNNER_TEMP}/task-definition-next.json"

          next_task_def_arn="$(aws ecs register-task-definition \
            --cli-input-json "file://${RUNNER_TEMP}/task-definition-next.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "arn=${next_task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS service
        if: steps.freshness.outputs.current == 'true'
        id: api_deploy
        timeout-minutes: 30
        shell: bash
        env:
          API_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          API_IMAGE_URI_PARAMETER: ${{ steps.env.outputs.image_uri_parameter }}
          APP_URL: ${{ steps.env.outputs.app_url }}
          WORKER_ENABLED: ${{ steps.deployment_config.outputs.worker_enabled }}
          WORKER_IMAGE_TAG: ${{ steps.worker_image.outputs.tags }}
          FALLBACK_JAR_MODULES: ${{ steps.fallback_jars.outputs.modules }}
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.ecs_service }}"
          task_definition="${{ steps.task_def.outputs.arn }}"
          grace_seconds="${{ steps.env.outputs.ecs_health_check_grace_seconds }}"
          deployment_config='{"minimumHealthyPercent":50,"maximumPercent":200,"deploymentCircuitBreaker":{"enable":true,"rollback":true}}'
          worker_build_pid=""
          worker_build_status="not-requested"

          finish_worker_build() {
            if [ -z "${worker_build_pid}" ]; then
              echo "worker_build_succeeded=${worker_build_status}" >> "$GITHUB_OUTPUT"
              return
            fi

            if wait "${worker_build_pid}"; then
              echo "worker_build_succeeded=true" >> "$GITHUB_OUTPUT"
            else
              echo "worker_build_succeeded=false" >> "$GITHUB_OUTPUT"
            fi
            worker_build_pid=""
          }

          trap finish_worker_build EXIT

          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            > service-before.json
          previous_task_definition="$(jq -r \
            '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' \
            service-before.json)"
          if [ -z "${previous_task_definition}" ] || [ "${previous_task_definition}" = "null" ]; then
            echo "::error::Core API service has no PRIMARY task definition."
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "${previous_task_definition}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/previous-task-definition.json"
          previous_image_uri="$(jq -r \
            --arg container "${{ steps.env.outputs.ecs_container }}" \
            '.containerDefinitions[] | select(.name == $container) | .image' \
            "${RUNNER_TEMP}/previous-task-definition.json")"

          abort_worker_build() {
            if [ -n "${worker_build_pid}" ]; then
              kill "${worker_build_pid}" 2>/dev/null || true
              wait "${worker_build_pid}" 2>/dev/null || true
              echo "worker_build_succeeded=false" >> "$GITHUB_OUTPUT"
              worker_build_pid=""
            fi
            trap - EXIT
          }

          restore_previous_api() {
            local restored_task_definition
            aws ecs update-service \
              --cluster "${cluster}" \
              --service "${service}" \
              --task-definition "${previous_task_definition}" \
              --health-check-grace-period-seconds "${grace_seconds}" \
              --deployment-configuration "${deployment_config}" \
              --force-new-deployment \
              > service-rollback.json
            aws ecs wait services-stable \
              --cluster "${cluster}" \
              --services "${service}"
            restored_task_definition="$(aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${service}" \
              --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' \
              --output text)"
            if [ "${restored_task_definition}" != "${previous_task_definition}" ]; then
              echo "::error::API rollback failed: expected ${previous_task_definition}, got ${restored_task_definition}."
              return 1
            fi
            local ssm_restored=false
            local attempt
            for attempt in 1 2 3; do
              if aws ssm put-parameter \
                --name "${API_IMAGE_URI_PARAMETER}" \
                --type String \
                --value "${previous_image_uri}" \
                --overwrite; then
                ssm_restored=true
                break
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "${ssm_restored}" != "true" ]; then
              echo "::error::API revision restored but SSM restoration failed."
              return 1
            fi
          }

          aws ecs update-service \
            --cluster "${cluster}" \
            --service "${service}" \
            --task-definition "${task_definition}" \
            --health-check-grace-period-seconds "${grace_seconds}" \
            --deployment-configuration "${deployment_config}" \
            --force-new-deployment \
            > service-update.json

          # "Decide fallback bootJars" already looked up the Worker image, and
          # "Build fallback bootJars" staged its jar when it was missing. Assemble
          # and push the Worker target while ECS stabilizes the API. Worker
          # rollout still waits for both operations to succeed.
          if [ "${WORKER_ENABLED}" = "true" ]; then
            if [[ " ${FALLBACK_JAR_MODULES} " != *" core-worker "* ]]; then
              echo "Reusing existing immutable Worker image."
              worker_build_status="true"
              echo "worker_image=existing" >> "$GITHUB_OUTPUT"
            else
              timeout --signal=TERM 900 docker buildx build --target core-worker \
                --platform linux/amd64 \
                --file Dockerfile \
                --tag "${WORKER_IMAGE_TAG}" \
                --push \
                build/image-jars &
              worker_build_pid=$!
              echo "worker_image=built" >> "$GITHUB_OUTPUT"
            fi
          fi

          deadline=$((SECONDS + 1500))
          requested_deployment_seen="$(jq -r \
            --arg task_definition "${task_definition}" \
            'any(.service.deployments[]?; .taskDefinition == $task_definition)' \
            service-update.json)"
          while true; do
            aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${service}" \
              > service.json

            primary_task_definition="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' service.json)"
            primary_rollout_state="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' service.json)"
            requested_rollout_state="$(jq -r \
              --arg task_definition "${task_definition}" \
              '([.services[0].deployments[] | select(.taskDefinition == $task_definition) | (.rolloutState // "UNKNOWN")][0] // "MISSING")' \
              service.json)"
            deployment_count="$(jq -r '.services[0].deployments | length' service.json)"
            desired_count="$(jq -r '.services[0].desiredCount' service.json)"
            running_count="$(jq -r '.services[0].runningCount' service.json)"
            pending_count="$(jq -r '.services[0].pendingCount' service.json)"

            echo "ECS service ${service}: rollout=${primary_rollout_state}, deployments=${deployment_count}, running=${running_count}/${desired_count}, pending=${pending_count}"

            if [ "${requested_rollout_state}" != "MISSING" ]; then
              requested_deployment_seen=true
            fi

            if [ "${primary_rollout_state}" = "COMPLETED" ] \
              && [ "${primary_task_definition}" = "${task_definition}" ] \
              && [ "${deployment_count}" = "1" ] \
              && [ "${running_count}" = "${desired_count}" ] \
              && [ "${pending_count}" = "0" ]; then
              echo "ECS service ${service} is stable on ${task_definition}."
              break
            fi

            if [ "${requested_rollout_state}" = "FAILED" ]; then
              abort_worker_build
              echo "::error::ECS deployment failed before the service became stable."
              jq '.services[0].events[0:10]' service.json
              exit 1
            fi

            if [ "${requested_deployment_seen}" = "true" ] \
              && [ "${requested_rollout_state}" = "MISSING" ] \
              && [ "${primary_task_definition}" != "${task_definition}" ]; then
              abort_worker_build
              echo "::error::ECS rolled back from ${task_definition} to ${primary_task_definition}."
              jq '.services[0].events[0:10]' service.json
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              abort_worker_build
              echo "::error::Timed out waiting for ECS service ${service} to stabilize."
              jq '.services[0].deployments' service.json
              jq '.services[0].events[0:10]' service.json
              exit 1
            fi

            sleep 5
          done

          if ! bash infra/terraform/scripts/smoke-test.sh "${APP_URL}"; then
            abort_worker_build
            echo "::error::Smoke failed; restoring ${previous_task_definition}."
            restore_previous_api
            exit 1
          fi

          # Commit the API deployment boundary before waiting on the independent
          # Worker build result. A Worker timeout cannot hide a stable API image.
          ssm_committed=false
          for attempt in 1 2 3; do
            if aws ssm put-parameter \
              --name "${API_IMAGE_URI_PARAMETER}" \
              --type String \
              --value "${API_IMAGE_URI}" \
              --overwrite; then
              ssm_committed=true
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ "${ssm_committed}" != "true" ]; then
            abort_worker_build
            echo "::error::API SSM commit failed; restoring ${previous_task_definition}."
            restore_previous_api
            exit 1
          fi

          finish_worker_build
          trap - EXIT

      - name: Mark Core API deployment bundle
        if: steps.freshness.outputs.current == 'true'
        id: api_bundle
        shell: bash
        run: |
          deployed_image="$(bash infra/terraform/scripts/copy-image-by-digest.sh \
            "${{ steps.image.outputs.image_uri }}" \
            "${{ steps.env.outputs.ecr_repository_url }}:deployed-dev-${DEPLOY_SHA::12}")"
          echo "image_uri=${deployed_image}" >> "$GITHUB_OUTPUT"

      - name: Fail when Notification Worker image build failed
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.worker_enabled == 'true' && steps.api_deploy.outputs.worker_build_succeeded != 'true'
        shell: bash
        run: |
          echo "::error::Core API is stable, but the Notification Worker image build failed. Worker deployment was not started."
          exit 1

      - name: Register Notification Worker task definition revision
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.worker_enabled == 'true'
        id: worker_task_def
        shell: bash
        env:
          BUNDLE_RECORDED: ${{ steps.recorded.outputs.recorded }}
          RECORDED_TASK_DEFINITION_ARN: ${{ steps.recorded.outputs.worker_task_definition_arn }}
        run: |
          set -euo pipefail

          container="${{ steps.env.outputs.worker_ecs_container }}"
          template_task_def_arn="${{ steps.env.outputs.worker_ecs_task_definition }}"
          image_uri="${{ steps.worker_image.outputs.image_uri }}"

          # Earlier steps matched the Worker toggle and the recorded image.
          if [ "${BUNDLE_RECORDED}" = "true" ]; then
            echo "Reusing recorded Notification Worker task definition ${RECORDED_TASK_DEFINITION_ARN}."
            echo "arn=${RECORDED_TASK_DEFINITION_ARN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 infra/terraform/scripts/prepare_ecs_task.py \
            --file "${RUNNER_TEMP}/worker-task-definition.json" --expected-arn "${template_task_def_arn}" \
            --container "${container}" --image "${image_uri}" --release "${DEPLOY_SHA}" \
            > "${RUNNER_TEMP}/worker-task-definition-next.json"

          next_task_def_arn="$(aws ecs register-task-definition \
            --cli-input-json "file://${RUNNER_TEMP}/worker-task-definition-next.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "arn=${next_task_def_arn}" >> "$GITHUB_OUTPUT"

      - name: Deploy Notification Worker ECS service
        id: worker_deploy
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.worker_enabled == 'true'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.worker_ecs_service }}"
          task_definition="${{ steps.worker_task_def.outputs.arn }}"
          deployment_config='{"minimumHealthyPercent":0,"maximumPercent":200,"deploymentCircuitBreaker":{"enable":true,"rollback":true}}'

          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            > worker-service-before.json
          previous_task_definition="$(jq -r \
            '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' \
            worker-service-before.json)"
          if [ -z "${previous_task_definition}" ] || [ "${previous_task_definition}" = "null" ]; then
            echo "::error::Worker service has no PRIMARY task definition."
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "${previous_task_definition}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/worker-previous-task-definition.json"
          previous_image_uri="$(jq -r \
            --arg container "${{ steps.env.outputs.worker_ecs_container }}" \
            '.containerDefinitions[] | select(.name == $container) | .image' \
            "${RUNNER_TEMP}/worker-previous-task-definition.json")"
          echo "previous_task_definition_arn=${previous_task_definition}" >> "$GITHUB_OUTPUT"
          echo "previous_image_uri=${previous_image_uri}" >> "$GITHUB_OUTPUT"

          aws ecs update-service \
            --cluster "${cluster}" \
            --service "${service}" \
            --task-definition "${task_definition}" \
            --deployment-configuration "${deployment_config}" \
            --force-new-deployment \
            > worker-service-update.json

          desired_count="$(jq -r '.service.desiredCount' worker-service-update.json)"
          if [ "${desired_count}" = "0" ]; then
            echo "Notification Worker desired count is 0; task definition ${task_definition} is staged without starting a task."
            exit 0
          fi

          deadline=$((SECONDS + 1500))
          requested_deployment_seen="$(jq -r \
            --arg task_definition "${task_definition}" \
            'any(.service.deployments[]?; .taskDefinition == $task_definition)' \
            worker-service-update.json)"
          while true; do
            aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${service}" \
              > worker-service.json

            primary_task_definition="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' worker-service.json)"
            primary_rollout_state="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' worker-service.json)"
            requested_rollout_state="$(jq -r \
              --arg task_definition "${task_definition}" \
              '([.services[0].deployments[] | select(.taskDefinition == $task_definition) | (.rolloutState // "UNKNOWN")][0] // "MISSING")' \
              worker-service.json)"
            deployment_count="$(jq -r '.services[0].deployments | length' worker-service.json)"
            running_count="$(jq -r '.services[0].runningCount' worker-service.json)"
            pending_count="$(jq -r '.services[0].pendingCount' worker-service.json)"

            echo "Notification Worker ${service}: rollout=${primary_rollout_state}, deployments=${deployment_count}, running=${running_count}/${desired_count}, pending=${pending_count}"

            if [ "${requested_rollout_state}" != "MISSING" ]; then
              requested_deployment_seen=true
            fi

            if [ "${primary_rollout_state}" = "COMPLETED" ] \
              && [ "${primary_task_definition}" = "${task_definition}" ] \
              && [ "${deployment_count}" = "1" ] \
              && [ "${running_count}" = "${desired_count}" ] \
              && [ "${pending_count}" = "0" ]; then
              echo "Notification Worker ${service} is stable on ${task_definition}."
              break
            fi

            if [ "${requested_rollout_state}" = "FAILED" ]; then
              echo "::error::Notification Worker deployment failed before the service became stable."
              jq '.services[0].events[0:10]' worker-service.json
              exit 1
            fi

            if [ "${requested_deployment_seen}" = "true" ] \
              && [ "${requested_rollout_state}" = "MISSING" ] \
              && [ "${primary_task_definition}" != "${task_definition}" ]; then
              echo "::error::Notification Worker rolled back from ${task_definition} to ${primary_task_definition}."
              jq '.services[0].events[0:10]' worker-service.json
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for Notification Worker ${service} to stabilize."
              jq '.services[0].deployments' worker-service.json
              jq '.services[0].events[0:10]' worker-service.json
              exit 1
            fi

            sleep 5
          done

      - name: Store Notification Worker image URI in SSM
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.worker_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssm_committed=false
          for attempt in 1 2 3; do
            if aws ssm put-parameter \
              --name "${{ steps.env.outputs.worker_image_uri_parameter }}" \
              --type String \
              --value "${{ steps.worker_image.outputs.image_uri }}" \
              --overwrite; then
              ssm_committed=true
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ "${ssm_committed}" != "true" ]; then
            echo "::error::Worker SSM commit failed; restoring previous task definition."
            aws ecs update-service \
              --cluster "${{ steps.env.outputs.ecs_cluster }}" \
              --service "${{ steps.env.outputs.worker_ecs_service }}" \
              --task-definition "${{ steps.worker_deploy.outputs.previous_task_definition_arn }}" \
              --force-new-deployment \
              > worker-service-rollback.json
            aws ecs wait services-stable \
              --cluster "${{ steps.env.outputs.ecs_cluster }}" \
              --services "${{ steps.env.outputs.worker_ecs_service }}"
            restored_task_definition="$(aws ecs describe-services \
              --cluster "${{ steps.env.outputs.ecs_cluster }}" \
              --services "${{ steps.env.outputs.worker_ecs_service }}" \
              --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' \
              --output text)"
            if [ "${restored_task_definition}" != "${{ steps.worker_deploy.outputs.previous_task_definition_arn }}" ]; then
              echo "::error::Worker rollback failed after SSM commit failure."
              exit 1
            fi
            ssm_restored=false
            for attempt in 1 2 3; do
              if aws ssm put-parameter \
                --name "${{ steps.env.outputs.worker_image_uri_parameter }}" \
                --type String \
                --value "${{ steps.worker_deploy.outputs.previous_image_uri }}" \
                --overwrite; then
                ssm_restored=true
                break
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "${ssm_restored}" != "true" ]; then
              echo "::error::Worker revision restored but SSM restoration failed."
            fi
            exit 1
          fi

      - name: Mark Notification Worker deployment bundle
        id: worker_bundle
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.worker_enabled == 'true'
        shell: bash
        run: |
          deployed_image="$(bash infra/terraform/scripts/copy-image-by-digest.sh \
            "${{ steps.worker_image.outputs.image_uri }}" \
            "${{ steps.env.outputs.worker_ecr_repository_url }}:deployed-dev-${DEPLOY_SHA::12}")"
          echo "image_uri=${deployed_image}" >> "$GITHUB_OUTPUT"

      - name: Record immutable dev deployment bundle
        if: steps.freshness.outputs.current == 'true' && steps.deployment_config.outputs.ledger_enabled == 'true'
        shell: bash
        run: |
          bash infra/terraform/scripts/record-deployment-bundle.sh \
            "${{ steps.env.outputs.bundle_parameter_prefix }}" \
            dev \
            "${DEPLOY_SHA}" \
            "${{ steps.api_bundle.outputs.image_uri }}" \
            "${{ steps.task_def.outputs.arn }}" \
            "${{ steps.worker_bundle.outputs.image_uri }}" \
            "${{ steps.worker_task_def.outputs.arn }}"

      - name: Print ECS diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.ecs_service }}"

          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            > service.json

          echo "Recent ECS deployments:"
          jq '.services[0].deployments' service.json

          echo "Recent ECS events:"
          jq '.services[0].events[0:20]' service.json

          target_group_arn="$(jq -r '.services[0].loadBalancers[0].targetGroupArn // empty' service.json)"
          if [ -n "${target_group_arn}" ]; then
            echo "Target health:"
            if ! aws elbv2 describe-target-health \
              --target-group-arn "${target_group_arn}" \
              --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
              --output json; then
              echo "::warning::Target health diagnostics failed; continuing with stopped task diagnostics."
            fi
          fi

          task_arns="$(aws ecs list-tasks \
            --cluster "${cluster}" \
            --service-name "${service}" \
            --desired-status STOPPED \
            --max-items 5 \
            --query 'taskArns' \
            --output text)"
          if [ -n "${task_arns}" ] && [ "${task_arns}" != "None" ]; then
            echo "Recent stopped tasks:"
            aws ecs describe-tasks \
              --cluster "${cluster}" \
              --tasks ${task_arns} \
              --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,stoppedReason:stoppedReason,stoppedAt:stoppedAt,containers:containers[].{name:name,exitCode:exitCode,reason:reason,lastStatus:lastStatus,healthStatus:healthStatus}}' \
              --output json
          fi

      - name: Print Notification Worker ECS diagnostics
        if: failure() && steps.deployment_config.outputs.worker_enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cluster="${{ steps.env.outputs.ecs_cluster }}"
          service="${{ steps.env.outputs.worker_ecs_service }}"

          aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            > worker-service.json

          echo "Recent Notification Worker deployments:"
          jq '.services[0].deployments' worker-service.json

          echo "Recent Notification Worker events:"
          jq '.services[0].events[0:20]' worker-service.json

          task_arns="$(aws ecs list-tasks \
            --cluster "${cluster}" \
            --service-name "${service}" \
            --desired-status STOPPED \
            --max-items 5 \
            --query 'taskArns' \
            --output text)"
          if [ -n "${task_arns}" ] && [ "${task_arns}" != "None" ]; then
            echo "Recent stopped Notification Worker tasks:"
            aws ecs describe-tasks \
              --cluster "${cluster}" \
              --tasks ${task_arns} \
              --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,stoppedReason:stoppedReason,stoppedAt:stoppedAt,containers:containers[].{name:name,exitCode:exitCode,reason:reason,lastStatus:lastStatus,healthStatus:healthStatus}}' \
              --output json
          fi

      # MOI-490: a run superseded by a newer runtime revision reports a short
      # `skipped` line, so the merger knows another run deploys their commit.
      - name: Notify Slack
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL_DEV }}
          DEPLOY_ENVIRONMENT: dev
          DEPLOY_KIND: deployment
          DEPLOY_OUTCOME: ${{ job.status }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CURRENT: ${{ steps.freshness.outputs.current }}
          LATEST_SHA: ${{ steps.freshness.outputs.latest_sha }}
          API_RESULT: ${{ steps.api_deploy.outcome }}
          API_BUILD_RESULT: ${{ steps.api_build.outcome }}
          API_CANDIDATE: ${{ steps.candidate.outputs.api }}
          API_IMAGE_EXISTS: ${{ steps.api_image_cache.outputs.exists }}
          WORKER_STEP_RESULT: ${{ steps.worker_deploy.outcome }}
          WORKER_ENABLED: ${{ steps.deployment_config.outputs.worker_enabled }}
          WORKER_BUILD_SUCCEEDED: ${{ steps.api_deploy.outputs.worker_build_succeeded }}
          WORKER_CANDIDATE: ${{ steps.candidate.outputs.worker }}
          WORKER_IMAGE: ${{ steps.api_deploy.outputs.worker_image }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: bash infra/terraform/scripts/notify-dev-deployment.sh
