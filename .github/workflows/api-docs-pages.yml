name: API Docs Pages

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "core/core-api/src/**"
      - "core/core-api/build.gradle.kts"
      - "core/core-enum/src/**"
      - "tests/api-docs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/scripts/openapi_operation_diff.py"
      - ".github/scripts/notify-api-spec-change.sh"
      - ".github/workflows/api-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish API docs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # -x check: openapi3 가 check(전체 테스트 스위트)에 의존하지만, 문서 생성엔 restDocsTest 만 필요하다.
      - name: Build API docs
        run: ./gradlew :core:core-api:asciidoctor :core:core-api:openapi3 -x check

      - name: Resolve branch publish path
        id: publish_path
        shell: bash
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          target_dir="api/branches/${safe_ref}"
          echo "safe_ref=${safe_ref}" >> "$GITHUB_OUTPUT"
          echo "target_dir=${target_dir}" >> "$GITHUB_OUTPUT"

      - name: Load previous published OpenAPI
        id: previous_spec
        shell: bash
        env:
          TARGET_DIR: ${{ steps.publish_path.outputs.target_dir }}
        run: |
          set -euo pipefail

          previous_spec="${RUNNER_TEMP}/previous-openapi3.yaml"
          remote_ref="$(git ls-remote --heads origin refs/heads/gh-pages)"
          if [ -z "${remote_ref}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          previous_path="${TARGET_DIR}/openapi/openapi3.yaml"
          if git cat-file -e "origin/gh-pages:${previous_path}" 2>/dev/null; then
            git show "origin/gh-pages:${previous_path}" > "${previous_spec}"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "path=${previous_spec}" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenAPI diff dependency
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Compare published and generated OpenAPI
        id: api_diff
        shell: bash
        env:
          PREVIOUS_AVAILABLE: ${{ steps.previous_spec.outputs.available }}
          PREVIOUS_SPEC: ${{ steps.previous_spec.outputs.path }}
        run: |
          set -euo pipefail

          diff_file="${RUNNER_TEMP}/api-spec-diff.tsv"
          : > "${diff_file}"
          if [ "${PREVIOUS_AVAILABLE}" = "true" ]; then
            python3 .github/scripts/openapi_operation_diff.py \
              "${PREVIOUS_SPEC}" \
              core/core-api/build/api-spec/openapi3.yaml \
              > "${diff_file}"
          else
            echo "::notice::이 브랜치의 공개 스펙이 없어 이번 실행을 알림 기준선으로 사용한다."
          fi

          if [ -s "${diff_file}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### API spec changes"
              echo '```text'
              cat "${diff_file}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "file=${diff_file}" >> "$GITHUB_OUTPUT"

      - name: Prepare publish directory
        shell: bash
        run: |
          target_dir="${{ steps.publish_path.outputs.target_dir }}"
          mkdir -p "public/${target_dir}"
          cp -R core/core-api/build/docs/asciidoc/. "public/${target_dir}/"
          mkdir -p "public/${target_dir}/openapi"
          cp core/core-api/build/api-spec/openapi3.yaml "public/${target_dir}/openapi/openapi3.yaml"
          cp core/core-api/build/api-spec/openapi3.yml "public/${target_dir}/openapi/openapi3.yml"
          mkdir -p "public/${target_dir}/swagger"
          cat > "public/${target_dir}/swagger/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Moimyeon API - Swagger UI</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              window.onload = () => {
                window.ui = SwaggerUIBundle({
                  url: "../openapi/openapi3.yaml",
                  dom_id: "#swagger-ui",
                });
              };
            </script>
          </body>
          </html>
          EOF
          touch public/.nojekyll
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Moimyeon API Docs</title>
          </head>
          <body>
            <main>
              <h1>Moimyeon API Docs</h1>
              <ul>
                <li>dev:
                  <a href="./api/branches/dev/">REST Docs</a> ·
                  <a href="./api/branches/dev/swagger/">Swagger UI</a> ·
                  <a href="./api/branches/dev/openapi/openapi3.yaml">openapi3.yaml</a>
                </li>
                <li>main:
                  <a href="./api/branches/main/">REST Docs</a> ·
                  <a href="./api/branches/main/swagger/">Swagger UI</a> ·
                  <a href="./api/branches/main/openapi/openapi3.yaml">openapi3.yaml</a>
                </li>
              </ul>
            </main>
          </body>
          </html>
          EOF

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: "docs(api): publish ${{ github.ref_name }} API docs"

      - name: Notify API spec changes to Slack
        if: steps.api_diff.outputs.changed == 'true' && github.ref_name == 'dev'
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_API_SPEC_WEBHOOK_URL }}
          API_SPEC_DIFF_FILE: ${{ steps.api_diff.outputs.file }}
          API_SPEC_BRANCH: ${{ github.ref_name }}
          API_SPEC_SHA: ${{ github.sha }}
          API_SPEC_ACTOR: ${{ github.actor }}
          API_SPEC_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify-api-spec-change.sh
